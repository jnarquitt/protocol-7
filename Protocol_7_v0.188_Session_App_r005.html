<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Protocol 7 v0.188 Session App r005</title><style>html,body{margin:0;width:100%;height:100%;background:#0d0b0b}#app{display:block;width:100%;height:100%;border:0}.badge{position:fixed;right:8px;top:7px;z-index:20;background:#8e2d2d;color:#fff;padding:4px 7px;border-radius:7px;font:700 11px system-ui;pointer-events:none}</style></head><body><div class="badge">r005 PLAYTEST</div><iframe id="app" src="./Protocol_7_v0.188_Session_App_r003.html?v=r005"></iframe><script>
const f=document.getElementById('app');f.addEventListener('load',()=>{const w=f.contentWindow,d=f.contentDocument;if(!d||d.getElementById('r005patch'))return;const st=d.createElement('style');st.id='r005patch';st.textContent=`.r5{background:#171313;border:2px solid #705a45;border-radius:12px;padding:12px;margin:10px 0}.r5grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.r5big{font-size:1.25rem;font-weight:900;color:#d7a82d}.r5ap{font-size:1.55rem;letter-spacing:.15em}.r5small{font-size:.78rem;color:#c6b9a6}.r5modal{position:fixed;inset:0;background:#0d0b0bf8;z-index:9999;overflow:auto;padding:12px;box-sizing:border-box}.r5modal .card{max-width:700px;margin:10px auto}.r5close{position:sticky;top:0;width:100%;z-index:3;background:#8e2d2d!important}.r5vam{display:block;width:100%;text-align:left;margin:5px 0}.r5tag{display:inline-block;border:1px solid #665246;border-radius:999px;padding:3px 6px;margin:2px;font-size:.75rem}.r5ready{color:#9ee6a8}.r5used{color:#ffb0a8}`;d.head.appendChild(st);
let state=JSON.parse(localStorage.getItem('p7r005meta')||'{}');state.level=state.level||1;state.mastered=state.mastered||[];state.edge=state.edge||null;state.history=state.history||[];state.recent=state.recent||[];state.vamUses=state.vamUses||{};function ms(){localStorage.setItem('p7r005meta',JSON.stringify(state))}function base(){try{return JSON.parse(localStorage.getItem('p7v188r003')||'{}')}catch(e){return {}}}function saveBase(s){localStorage.setItem('p7v188r003',JSON.stringify(s))}function skillDie(r){return r==0?4:r<3?6:r<6?8:r<10?10:12}function chooseSkill(n){let s=d.getElementById('rollSkill');if(!s)return;s.value=n;s.dispatchEvent(new Event('change',{bubbles:true}));state.recent=[n,...state.recent.filter(x=>x!==n)].slice(0,5);ms();s.scrollIntoView({behavior:'smooth',block:'center'})}function apDots(){let n=Number(d.getElementById('ap')?.textContent||3);return '●'.repeat(n)+'○'.repeat(Math.max(0,3-n))}
const play=d.getElementById('play');if(play){let h=play.querySelector('h2');let dash=d.createElement('div');dash.className='r5';dash.innerHTML='<div class="r5grid"><div><div class="r5small">LEVEL</div><div class="r5big" id="r5level"></div></div><div><div class="r5small">ACTION POINTS</div><div class="r5ap" id="r5ap"></div></div><div><div class="r5small">REACTION</div><div class="r5big r5ready" id="r5react"></div></div><div><div class="r5small">ADVANCEMENT</div><button id="r5levelup">LEVEL UP</button></div></div><button class="wide" id="r5edit">EDIT / REVIEW CHARACTER</button>';h.after(dash);dash.querySelector('#r5levelup').onclick=levelUp;dash.querySelector('#r5edit').onclick=()=>w.show('vector');function refreshDash(){dash.querySelector('#r5level').textContent=state.level;dash.querySelector('#r5ap').textContent=apDots();dash.querySelector('#r5react').textContent=(d.getElementById('react')?.textContent||'').includes('AVAILABLE')?'READY':'SPENT'}setInterval(refreshDash,500);refreshDash();let roll=d.getElementById('rollSkill')?.closest('.card');if(roll){let q=d.createElement('div');q.className='r5';q.innerHTML='<h3>Quick Rolls</h3><p class="r5small">Strongest trained Skills plus your most recent rolls. One tap builds the pool.</p><div id="r5quick" class="r5grid"></div>';roll.parentNode.insertBefore(q,roll);function quick(){let b=base(),r=b.ranks||{};let top=Object.entries(r).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]);let names=[...new Set([...state.recent,...top])].slice(0,6);q.querySelector('#r5quick').innerHTML=names.map(n=>`<button data-s="${n}">${n}<br>d${skillDie(r[n]||0)}</button>`).join('');q.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>{chooseSkill(x.dataset.s);quick()})}quick();let turn=[...play.querySelectorAll('.card')].find(x=>x.textContent.includes('Your Turn'));if(turn){let a=d.createElement('div');a.className='r5';a.innerHTML='<h3>Common Actions</h3><div class="r5grid"><button data-s="Sidearms">SIDEARM ATTACK</button><button data-s="Longarms">LONGARM ATTACK</button><button data-s="Unarmed">UNARMED</button><button data-s="Light Melee">MELEE</button><button data-s="Grappling">GRAPPLE</button><button data-s="Dodge">DODGE</button><button data-s="Perception">PERCEPTION</button><button data-s="Investigation">INVESTIGATE</button></div><p class="r5small">Movement remains 30 feet per AP. Gear, VAM, Mastery and Advantage/Disadvantage remain separate named dice sources.</p>';a.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>chooseSkill(x.dataset.s));turn.parentNode.insertBefore(a,turn)}}}
function levelUp(){if(state.level>=6){alert('v0.188 playtest progression currently ends at Level 6.');return}let next=state.level+1,b=base();let modal=d.createElement('div');modal.className='r5modal';let special=next==2?'Choose one Edge.':next==3||next==5?'Increase one Ability by one step.':next==4?'Master one Skill.':next==6?'Master a second Skill.':'';modal.innerHTML=`<button class="r5close">CANCEL</button><div class="card"><h2>Advance to Level ${next}</h2><p>Every level after 1 grants <b>+4 maximum HP</b> and <b>+4 Skill Ranks</b>.</p><p><b>BAR:</b> ${[16,18,21,24,27,30][next-1]}</p><p><b>Level benefit:</b> ${special}</p><div id="r5choice"></div><button class="wide" id="r5confirm">CONFIRM LEVEL ${next}</button></div>`;d.body.appendChild(modal);modal.querySelector('.r5close').onclick=()=>modal.remove();let c=modal.querySelector('#r5choice'),choice=null;if(next==2){c.innerHTML='<h3>Edge</h3>'+['Driven','Inspired','Prepared','Connected','Durable'].map(x=>`<button data-v="${x}">${x}</button>`).join('');c.querySelectorAll('[data-v]').forEach(x=>x.onclick=()=>{choice=x.dataset.v;c.querySelectorAll('button').forEach(z=>z.classList.remove('sel'));x.classList.add('sel')})}else if(next==3||next==5){let ab=b.abilities||{};c.innerHTML='<h3>Increase Ability</h3>'+['STR','DEX','CON','INT','WIS','CHA'].map(x=>`<button data-v="${x}" ${ab[x]>=12?'disabled':''}>${x} d${ab[x]||4} → ${ab[x]>=12?'MAX':'d'+({4:6,6:8,8:10,10:12}[ab[x]||4])}</button>`).join('');c.querySelectorAll('[data-v]').forEach(x=>x.onclick=()=>{choice=x.dataset.v;c.querySelectorAll('button').forEach(z=>z.classList.remove('sel'));x.classList.add('sel')})}else if(next==4||next==6){let r=b.ranks||{};c.innerHTML='<h3>Master Skill</h3>'+Object.keys(r).filter(x=>!state.mastered.includes(x)).sort().map(x=>`<button data-v="${x}">${x} d${skillDie(r[x]||0)}</button>`).join('');c.querySelectorAll('[data-v]').forEach(x=>x.onclick=()=>{choice=x.dataset.v;c.querySelectorAll('button').forEach(z=>z.classList.remove('sel'));x.classList.add('sel')})}modal.querySelector('#r5confirm').onclick=()=>{if(next>=2&&special&&choice==null){alert('Choose the Level benefit first.');return}let s=base();s.ranks=s.ranks||{};s.level=next;s.barCap=[16,18,21,24,27,30][next-1];s.hp=(s.hp||0)+4;s.maxhp=(s.maxhp||s.hp)+4;s.unspentAdvancementRanks=(s.unspentAdvancementRanks||0)+4;if(next==2){state.edge=choice;if(choice==='Durable'){s.hp+=5;s.maxhp+=5}}if(next==3||next==5){let old=s.abilities[choice],map={4:6,6:8,8:10,10:12};s.abilities[choice]=map[old]||old}if(next==4||next==6)state.mastered.push(choice);state.level=next;state.history.push({level:next,benefit:choice||special,date:new Date().toISOString()});saveBase(s);ms();modal.remove();alert(`Level ${next} complete. You have 4 new Skill Ranks to assign. BAR capacity is now ${s.barCap}.`);try{w.render()}catch(e){}}}
const vams=d.getElementById('vams');if(vams){let h=vams.querySelector('h2');let b=d.createElement('button');b.className='wide';b.textContent='RECOMMENDED / ALL VAMS / MY LOADOUT';b.onclick=vamBrowser;h.after(b)}async function vamBrowser(){let modal=d.createElement('div');modal.className='r5modal';modal.innerHTML='<button class="r5close">CLOSE</button><div class="card"><h2>VAM Browser</h2><div class="r5grid"><button data-mode="recommended">RECOMMENDED</button><button data-mode="all">ALL VAMS</button><button data-mode="mine">MY LOADOUT</button></div><select id="r5levelFilter" class="wide"><option value="start">AVAILABLE AT MY LEVEL</option><option value="all">SHOW ALL LEVELS</option></select><div id="r5vams">Loading…</div></div>';d.body.appendChild(modal);modal.querySelector('.r5close').onclick=()=>modal.remove();try{let j=await fetch('./PROJECT_DOCUMENTATION/APP_REBUILD/P7_v0.188_VAM_CANONICAL_DATABASE_r001.json').then(r=>r.json()),mode='recommended';function draw(){let bs=base(),mine=bs.vams||[],arr=j.vams;if(modal.querySelector('#r5levelFilter').value==='start')arr=arr.filter(v=>Number(v.level||1)<=state.level);if(mode==='mine')arr=arr.filter(v=>mine.includes(v.name));if(mode==='recommended')arr=arr.filter(v=>mine.includes(v.name)||Number(v.level||1)<=state.level).slice(0,18);modal.querySelector('#r5vams').innerHTML=`<p>${arr.length} shown • Level ${state.level}</p>`+arr.map(v=>`<button class="r5vam"><b>${v.name}</b> • ${v.bar} BAR • Level ${v.level}<br><span class="r5small">${String(v.family||'').replaceAll('_',' ')}</span></button>`).join('')}modal.querySelectorAll('[data-mode]').forEach(x=>x.onclick=()=>{mode=x.dataset.mode;draw()});modal.querySelector('#r5levelFilter').onchange=draw;draw()}catch(e){modal.querySelector('#r5vams').textContent='Unable to load canonical VAM database.'}}
const gear=d.getElementById('gear');if(gear){let h=gear.querySelector('h2');let note=d.createElement('div');note.className='r5';note.innerHTML='<b>Mission Loadout</b><p class="r5small">Select equipment authorized or reasonably available for this assignment. The GM approves unusual or excessive loadouts. r005 does not invent a new inventory-capacity rule.</p>';h.after(note)}
});</script></body></html>
