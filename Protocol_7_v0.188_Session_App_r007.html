const shell=document.getElementById('shell');shell.addEventListener('load',()=>{const a=shell.contentDocument,mid=a&&a.getElementById('shell');const b=mid&&mid.contentDocument,inner=b&&b.getElementById('app');if(!inner)return;const patch=()=>{const d=inner.contentDocument,w=inner.contentWindow;if(!d||d.getElementById('r007patch'))return;let st=d.createElement('style');st.id='r007patch';st.textContent='.r7{background:#171313;border:2px solid #8a704d;border-radius:12px;padding:12px;margin:10px 0}.r7grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.r7hot{box-shadow:0 0 0 3px #d4a72c inset}.r7small{font-size:.8rem;color:#c6b9a6}.r7modal{position:fixed;inset:0;background:#0d0b0bf8;z-index:99999;overflow:auto;padding:12px}.r7modal .card{max-width:700px;margin:10px auto}.r7bar{height:12px;background:#3b3230;border-radius:9px;overflow:hidden}.r7bar>i{display:block;height:100%;background:#d4a72c}';d.head.appendChild(st);function base(){try{return JSON.parse(localStorage.getItem('p7v188r003')||'{}')}catch(e){return {}}}function meta(){try{return JSON.parse(localStorage.getItem('p7r005meta')||'{}')}catch(e){return {}}}function vit(){try{return JSON.parse(localStorage.getItem('p7r006vitality')||'{}')}catch(e){return {}}}function saveBase(x){localStorage.setItem('p7v188r003',JSON.stringify(x))}function saveMeta(x){localStorage.setItem('p7r005meta',JSON.stringify(x))}
const play=d.getElementById('play');if(play){let panel=d.createElement('div');panel.className='r7';panel.innerHTML='<h3>Campaign Character</h3><div class="r7grid"><button id="r7export">EXPORT VECTOR</button><button id="r7import">IMPORT VECTOR</button></div><input id="r7file" type="file" accept="application/json,.json" style="display:none"><p class="r7small">Export a portable character backup before changing devices or clearing browser data.</p>';play.insertBefore(panel,play.children[1]||null);panel.querySelector('#r7export').onclick=()=>{let pack={format:'Protocol7-v0.188-vector',exported:new Date().toISOString(),character:base(),advancement:meta(),vitality:vit()};let blob=new Blob([JSON.stringify(pack,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),x=d.createElement('a');x.href=url;x.download='Protocol_7_Vector_v0.188.json';x.click();setTimeout(()=>URL.revokeObjectURL(url),500)};panel.querySelector('#r7import').onclick=()=>panel.querySelector('#r7file').click();panel.querySelector('#r7file').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let p=JSON.parse(r.result);if(p.format!=='Protocol7-v0.188-vector')throw 0;localStorage.setItem('p7v188r003',JSON.stringify(p.character||{}));localStorage.setItem('p7r005meta',JSON.stringify(p.advancement||{}));localStorage.setItem('p7r006vitality',JSON.stringify(p.vitality||{}));alert('Vector imported. Reloading current character.');location.reload()}catch(_){alert('That file is not a Protocol 7 v0.188 Vector export.')}};r.readAsText(f)};
let rb=d.getElementById('rollSkill');if(rb){let hint=d.createElement('div');hint.id='r7spark';hint.className='r7';rb.closest('.card').insertBefore(hint,rb.closest('.card').firstChild);function spark(){let s=base(),v=vit(),skill=rb.value,origin=s.origin||s.vitalityOrigin||'',all=s.allBlankVitality||s.vitalityAllBlank||false,map=(w.SKILLS||[]).find?.(x=>x.name===skill),eligible=all||!!(origin&&map&&map.abs&&map.abs.includes(origin));hint.classList.toggle('r7hot',eligible&&!v.used);hint.innerHTML='<b>Vitality '+(eligible?'AVAILABLE':'CHECK')+'</b><div class="r7small">'+(v.used?'Once-per-session benefit already used.':eligible?(all?'Perfect Equilibrium can apply if this roll contains a natural 1.':`This Skill involves ${origin}. Vitality Spark can apply if the roll contains a natural 1.`):origin?`Selected Skill does not involve ${origin}.`:'Complete the Vitality Ritual to establish this benefit.')+'</div>'}rb.addEventListener('change',spark);setInterval(spark,800);spark()}}
const gear=d.getElementById('gear');if(gear){let quick=d.createElement('div');quick.className='r7';quick.innerHTML='<h3>Use Equipped Gear</h3><p class="r7small">Current playtest helper: tap an equipped weapon/tool to jump toward the Roll Builder. The app keeps Gear as a named source rather than generic Advantage.</p><div id="r7gear"></div>';gear.insertBefore(quick,gear.children[1]||null);function drawGear(){let s=base(),g=s.gear||[];quick.querySelector('#r7gear').innerHTML=g.length?g.map(x=>`<button data-g="${typeof x==='string'?x:x.name||''}">${typeof x==='string'?x:x.name||'Gear'}</button>`).join(''):'<span class="r7small">No Gear in current loadout.</span>';quick.querySelectorAll('[data-g]').forEach(x=>x.onclick=()=>{w.show('play');setTimeout(()=>d.getElementById('rollSkill')?.scrollIntoView({behavior:'smooth'}),100)})}drawGear()}
let old=[...d.querySelectorAll('button')].find(x=>x.textContent.trim()==='LEVEL UP');if(old){old.textContent='GUIDED LEVEL UP';old.onclick=guidedLevel}
function guidedLevel(){let m=meta(),s=base(),next=(m.level||1)+1;if(next>6){alert('Current v0.188 playtest progression ends at Level 6.');return}let mod=d.createElement('div');mod.className='r7modal';let benefit=next==2?'Choose Edge':next==3||next==5?'Increase one Ability':next==4||next==6?'Choose Skill Mastery':'';mod.innerHTML=`<button class="wide" id="r7cancel">CANCEL</button><div class="card"><h2>Level ${next} Advancement</h2><p><b>Automatic:</b> +4 maximum HP • BAR ${[16,18,21,24,27,30][next-1]}</p><p><b>Special:</b> ${benefit}</p><h3>Spend 4 Skill Ranks</h3><div class="r7bar"><i id="r7fill" style="width:0%"></i></div><p><b><span id="r7left">4</span> ranks remaining</b></p><div id="r7skills"></div><button class="wide" id="r7finish" disabled>COMPLETE ADVANCEMENT</button></div>`;d.body.appendChild(mod);mod.querySelector('#r7cancel').onclick=()=>mod.remove();let ranks=structuredClone(s.ranks||{}),spent=0;function draw(){let top=Object.keys(ranks).sort((a,b)=>(ranks[b]||0)-(ranks[a]||0)).slice(0,16);mod.querySelector('#r7skills').innerHTML=top.map(n=>`<button data-s="${n}" ${(ranks[n]||0)>=10?'disabled':''}>+ ${n} (${ranks[n]||0} ranks)</button>`).join('');mod.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>{if(spent>=4)return;ranks[x.dataset.s]=(ranks[x.dataset.s]||0)+1;spent++;draw()});mod.querySelector('#r7left').textContent=4-spent;mod.querySelector('#r7fill').style.width=(spent/4*100)+'%';mod.querySelector('#r7finish').disabled=spent!==4}draw();mod.querySelector('#r7finish').onclick=()=>{s.ranks=ranks;s.hp=(s.hp||0)+4;s.maxhp=(s.maxhp||s.hp)+4;s.barCap=[16,18,21,24,27,30][next-1];m.level=next;m.history=m.history||[];m.history.push({level:next,date:new Date().toISOString(),skillRanksSpent:4,special:'pending guided special choice in current playtest'});saveBase(s);saveMeta(m);mod.remove();alert(`Level ${next}: Skill Ranks spent, +4 maximum HP applied, BAR ${s.barCap}. Now review the Level ${next} special benefit in Advancement.`);try{w.render()}catch(e){}}}
