<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Protocol 7 v0.188 Session App r006</title><style>html,body{margin:0;width:100%;height:100%;background:#0d0b0b}#shell{display:block;width:100%;height:100%;border:0}.badge{position:fixed;right:8px;top:7px;z-index:50;background:#8e2d2d;color:#fff;padding:4px 7px;border-radius:7px;font:700 11px system-ui;pointer-events:none}</style></head><body><div class="badge">r006 PLAYTEST</div><iframe id="shell" src="./Protocol_7_v0.188_Session_App_r005.html?v=r006fix1"></iframe><script>
const shell=document.getElementById('shell');shell.addEventListener('load',()=>{const outer=shell.contentDocument,inner=outer&&outer.getElementById('app');if(!inner)return;const patch=()=>{const d=inner.contentDocument,w=inner.contentWindow;if(!d||d.getElementById('r006patch'))return;const st=d.createElement('style');st.id='r006patch';st.textContent='.r6{background:#171313;border:2px solid #8a704d;border-radius:12px;padding:12px;margin:10px 0}.r6 button{margin:3px}.r6ready{color:#9ee6a8;font-weight:900}.r6used{color:#ffb0a8;font-weight:900}';d.head.appendChild(st);function meta(){try{return JSON.parse(localStorage.getItem('p7r006vitality')||'{}')}catch(e){return {}}}function save(x){localStorage.setItem('p7r006vitality',JSON.stringify(x))}function base(){try{return JSON.parse(localStorage.getItem('p7v188r003')||'{}')}catch(e){return {}}}
const vit=d.getElementById('vit');if(vit&&!d.getElementById('r6rollall')){const b=d.createElement('button');b.id='r6rollall';b.className='wide next';b.textContent='ROLL ALL VITALITY DICE';b.onclick=()=>{let s=base();if(!s.abilities||Object.keys(s.abilities).length!==6){alert('Assign the six Ability dice first.');return}const faces=['STR','DEX','CON','INT','WIS','CHA'].map(a=>{const die=Number(s.abilities[a]);return 1+Math.floor(Math.random()*die)});s.vit=faces;const qualifying=faces.map((v,i)=>({v,i})).filter(x=>x.v>=4);if(!qualifying.length){s.maxhp=28;s.hp=28;s.origin='';s.vitalityOrigin='';s.allBlankVitality=true;s.vitalityAllBlank=true}else{const high=Math.max(...qualifying.map(x=>x.v));const tied=qualifying.filter(x=>x.v===high);s.maxhp=18+high;s.hp=s.maxhp;s.allBlankVitality=false;s.vitalityAllBlank=false;if(tied.length===1){s.origin=['STR','DEX','CON','INT','WIS','CHA'][tied[0].i];s.vitalityOrigin=s.origin}else{s.origin='';s.vitalityOrigin=''}}localStorage.setItem('p7v188r003',JSON.stringify(s));try{w.render()}catch(e){};if(qualifying.length&&qualifying.filter(x=>x.v===Math.max(...qualifying.map(y=>y.v))).length>1){alert('Vitality dice rolled. Highest qualifying result is tied; choose your Vitality Origin from the tied Abilities.')}};vit.parentNode.insertBefore(b,vit);const p=d.createElement('p');p.className='mut';p.textContent='Roll all six Ability dice together with one tap. Each die is randomized independently from 1 through its actual die size. This is identical to rolling the six physical dice together.';b.after(p)}
const play=d.getElementById('play');if(play&&!d.getElementById('r6vitality')){let panel=d.createElement('div');panel.id='r6vitality';panel.className='r6';let first=play.querySelector('.card');first.parentNode.insertBefore(panel,first);function draw(){let s=base(),m=meta(),origin=s.origin||s.vitalityOrigin||'';let allBlank=s.allBlankVitality||s.vitalityAllBlank||false;let label=allBlank?'Perfect Equilibrium':origin?`Vitality Spark • ${origin}`:'Vitality Benefit';panel.innerHTML=`<h3>${label}</h3><p>${allBlank?'Once per session, after any Skill roll, reroll one die showing a natural 1; keep the new result.':origin?`Once per session, when the Skill’s three Ability dice include ${origin}, reroll one die showing a natural 1; keep the new result.`:'Once your Vitality Origin is established, it grants a once-per-session reroll when an eligible Skill roll contains a natural 1.'}</p><div class="${m.used?'r6used':'r6ready'}">${m.used?'USED THIS SESSION':'READY'}</div><button id="r6use" ${m.used?'disabled':''}>MARK REROLL USED</button><button id="r6reset">NEW SESSION • RESET</button>`;panel.querySelector('#r6use').onclick=()=>{m.used=true;save(m);draw()};panel.querySelector('#r6reset').onclick=()=>{save({used:false});draw()}}draw()}
};if(inner.contentDocument?.readyState==='complete')patch();inner.addEventListener('load',patch)});
</script></body></html>
