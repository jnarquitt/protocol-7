const play=d.getElementById('play');if(play){let p=d.createElement('div');p.className='r12';p.innerHTML='<h3>Current Vector — Tap to Build a Pool</h3><p class="r12small">PLAY is the only normal rolling surface. These buttons select what you are using and keep you here.</p><div class="r12head">Trained Skills</div><div id="r12skills" class="r12grid"></div><div class="r12head">Loaded VAMs</div><div id="r12vams" class="r12grid"></div><div class="r12head">Current Gear</div><div id="r12gear" class="r12grid"></div>';let roll=d.getElementById('rollSkill')?.closest('.card');roll?play.insertBefore(p,roll):play.appendChild(p);function draw(){let s=S(),r=s.ranks||{},v=s.vams||[],g=s.gear||[];p.querySelector('#r12skills').innerHTML=Object.keys(r).filter(n=>(r[n]||0)>0).sort((a,b)=>(r[b]||0)-(r[a]||0)).map(n=>`<button data-s="${n}">${n}<br><span class="r12small">${r[n]} ranks</span></button>`).join('')||'<span class="r12small">No trained Skills.</span>';p.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>go(x.dataset.s));p.querySelector('#r12vams').innerHTML=v.map(x=>{let n=typeof x==='string'?x:x.name||'VAM';return `<button data-v="${n}">${n}</button>`}).join('')||'<span class="r12small">No VAMs loaded.</span>';p.querySelectorAll('[data-v]').forEach(x=>x.onclick=()=>{let vm={'Rapid Triage':'Medicine','Sensory Filter':'Perception','Low-Light Adaptation':'Perception','Pattern Index':'Investigation','Memory Cueing':'Investigation','Period Native':'Culture','Vocal Control':'Influence','Language Scaffold':'Linguistics','Fine Motor Assist':'Security','Threat Map':'Tactics','Fast Draw':'Sidearms','Threat Focus':'Perception','Snap Shot':'Sidearms','Balance Assist':'Acrobatics','Combat Rescue':'Athletics'};go(vm[x.dataset.v]);});p.querySelector('#r12gear').innerHTML=g.map(x=>{let n=typeof x==='string'?x:x.name||'Gear',sk=gearMap[n];return `<button ${sk?'data-g="'+n+'"':'disabled'}>${n}${sk?`<br><span class="r12small">${sk}</span>`:'<br><span class="r12small">No default action</span>'}</button>`}).join('')||'<span class="r12small">No Gear equipped.</span>';p.querySelectorAll('[data-g]').forEach(x=>x.onclick=()=>go(gearMap[x.dataset.g],x.dataset.g))}draw()}
