<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Protocol 7 v0.188 App</title><style>html,body,#app{margin:0;width:100%;height:100%;border:0;background:#0d0b0b}body{overflow:hidden}</style></head><body><iframe id="app" src="./Protocol_7_v0.188_Session_App.html?v=188-hotfix-1"></iframe><script>
const f=document.getElementById('app');f.onload=()=>{const w=f.contentWindow,d=f.contentDocument;try{
// Vitality completion guidance.
const origin=d.getElementById('origin');if(origin){const next=d.createElement('div');next.id='vitalityNext';origin.after(next);const old=w.vitUI;w.vitUI=function(){old();const m=w.hpmax();const n=d.getElementById('vitalityNext');if(!n)return;n.innerHTML=m==null?'<p class="mut">Complete all six Vitality rolls to continue.</p>':'<div class="card" style="border:2px solid #d7a82d"><b>Vitality complete — starting HP '+m+'.</b><p>Next, review or assign your 20 Skill Ranks. Skills determine what your Vector is trained to do and show the dice pool those choices create.</p><button class="wide" style="background:#5a4515;border:2px solid #d7a82d" onclick="show(\'skills\')">NEXT: CHOOSE SKILLS →</button></div>'};w.vitUI();}
// Gear Catalog / Loadout tabs.
const gearSection=d.getElementById('gear'),gearCard=gearSection&&gearSection.querySelector('.card'),era=d.getElementById('era'),list=d.getElementById('gearList');if(gearCard&&era&&list){const tabs=d.createElement('div');tabs.className='row';tabs.innerHTML='<button id="gearCatalogTab" class="sel">GEAR CATALOG</button><button id="gearLoadoutTab">MY LOADOUT</button>';gearCard.insertBefore(tabs,era);const summary=d.createElement('div');summary.id='loadoutSummary';era.after(summary);let mode='catalog';const base=w.gearUI;function draw(){const cat=d.getElementById('gearCatalogTab'),load=d.getElementById('gearLoadoutTab');cat.className=mode==='catalog'?'sel':'';load.className=mode==='loadout'?'sel':'';era.style.display=mode==='catalog'?'block':'none';if(mode==='catalog'){summary.innerHTML='<p class="mut">Tap equipment to add or remove it from your Vector. Open My Loadout to see only what you are carrying.</p>';base();}else{summary.innerHTML='<p><b>'+(w.s.gear||[]).length+' items in loadout.</b> Tap an item to remove it. Return to Gear Catalog to add more.</p>';const chosen=w.G.filter(g=>(w.s.gear||[]).includes(g[0]));list.innerHTML=chosen.length?chosen.map(g=>'<button class="sel" onclick="tg(\''+g[0].replaceAll("'","\\'")+'\');parent.postMessage(\'refreshLoadout\',\'*\')"><b>'+g[0]+'</b><br>d'+g[1]+' • '+g[2]+'</button>').join(''):'<p class="mut">No gear selected yet. Return to Gear Catalog to build the loadout.</p>';}}
d.getElementById('gearCatalogTab').onclick=()=>{mode='catalog';draw()};d.getElementById('gearLoadoutTab').onclick=()=>{mode='loadout';draw()};w.addEventListener('message',e=>{if(e.data==='refreshLoadout'&&mode==='loadout')setTimeout(draw,0)});const oldTg=w.tg;w.tg=function(n){oldTg(n);if(mode==='loadout')draw()};draw();}
}catch(e){console.error('P7 hotfix',e)}};
</script></body></html>
