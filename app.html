<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Protocol 7 v0.188 App</title><style>html,body,#app{margin:0;width:100%;height:100%;border:0;background:#0d0b0b}body{overflow:hidden}</style></head><body><iframe id="app" src="./Protocol_7_v0.188_Session_App.html?v=188-flow-2"></iframe><script>
const f=document.getElementById('app');f.onload=()=>{const w=f.contentWindow,d=f.contentDocument;try{
const css=d.createElement('style');css.textContent='.creationStatus{position:sticky;top:0;z-index:7;background:#100d0d;border:1px solid #55443a;border-radius:10px;padding:8px;margin:0 0 10px}.meter{height:10px;background:#332724;border-radius:8px;overflow:hidden;margin:4px 0 8px}.meter i{display:block;height:100%;background:#d7a82d}.statusGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:.82rem}.flowButtons{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:14px}.nextBtn{background:#5a4515!important;border:2px solid #d7a82d!important}.complete{color:#d7a82d;font-weight:800}';d.head.appendChild(css);
function spent(){return Object.values(w.s.ranks||{}).reduce((a,b)=>a+b,0)}function vitDone(){return Object.values(w.s.vit||{}).every(v=>v!==null)}function statusHTML(){let r=spent(),left=Math.max(0,20-r),g=(w.s.gear||[]).length;return '<div class="creationStatus"><div class="statusGrid"><div><b>Skills '+r+'/20</b><div class="meter"><i style="width:'+Math.min(100,r/20*100)+'%"></i></div><span>'+left+' ranks remaining</span></div><div><b>Loadout '+g+' item'+(g==1?'':'s')+'</b><div class="meter"><i style="width:'+Math.min(100,g/6*100)+'%"></i></div><span>'+(vitDone()?'Vitality ✓':'Vitality incomplete')+'</span></div></div></div>'}
function installStatus(){['skills','gear','play'].forEach(id=>{let sec=d.getElementById(id);if(sec&&!sec.querySelector('.creationStatus')){let x=d.createElement('div');x.className='statusMount';sec.insertBefore(x,sec.children[1]||null)}});refreshStatus()}function refreshStatus(){d.querySelectorAll('.statusMount').forEach(x=>x.innerHTML=statusHTML())}
const origin=d.getElementById('origin');if(origin){const next=d.createElement('div');next.id='vitalityNext';origin.after(next);const old=w.vitUI;w.vitUI=function(){old();const m=w.hpmax(),n=d.getElementById('vitalityNext');if(!n)return;let review=w.s.preset!=null;n.innerHTML=m==null?'<p class="mut">Complete all six Vitality rolls to continue.</p>':'<div class="card" style="border:2px solid #d7a82d"><b>Vitality complete — starting HP '+m+'.</b><p>'+(review?'Your preconfigured Vector already has 20 Skill Ranks assigned. Review them next; change anything you want.':'Next assign the 20 Skill Ranks that define your Vector’s training.')+'</p><button class="wide nextBtn" onclick="show(\'skills\')">NEXT: '+(review?'REVIEW':'CHOOSE')+' SKILLS →</button></div>';refreshStatus()};w.vitUI();}
const skillSec=d.getElementById('skills'),skillCard=skillSec&&skillSec.querySelector('.card');if(skillCard){let foot=d.createElement('div');foot.id='skillContinue';skillCard.after(foot);function skillFooter(){let r=spent(),preset=w.s.preset!=null;foot.innerHTML='<div class="card"><div class="big">'+r+' / 20 Skill Ranks</div><p>'+(r==20?(preset?'Preset skills are complete. Review or edit them, then continue.':'All 20 ranks assigned. Your Skills are complete.'):'You have <b>'+(20-r)+'</b> ranks left to assign.')+'</p><div class="flowButtons"><button onclick="show(\'vector\')">← BACK</button><button class="nextBtn" '+(r==20?'':'disabled')+' onclick="show(\'gear\')">NEXT: GEAR / LOADOUT →</button></div></div>'}let oldSkills=w.skillsUI;w.skillsUI=function(){oldSkills();skillFooter();refreshStatus()};skillFooter()}
const gearSection=d.getElementById('gear'),gearCard=gearSection&&gearSection.querySelector('.card'),era=d.getElementById('era'),list=d.getElementById('gearList');if(gearCard&&era&&list){const tabs=d.createElement('div');tabs.className='row';tabs.innerHTML='<button id="gearCatalogTab" class="sel">GEAR CATALOG</button><button id="gearLoadoutTab">MY LOADOUT</button>';gearCard.insertBefore(tabs,era);const summary=d.createElement('div');summary.id='loadoutSummary';era.after(summary);let mode='catalog';const base=w.gearUI;function draw(){let cat=d.getElementById('gearCatalogTab'),load=d.getElementById('gearLoadoutTab');cat.className=mode==='catalog'?'sel':'';load.className=mode==='loadout'?'sel':'';era.style.display=mode==='catalog'?'block':'none';if(mode==='catalog'){summary.innerHTML='<p class="mut">Tap equipment to add/remove it. My Loadout shows only carried equipment.</p>';base()}else{summary.innerHTML='<p><b>'+(w.s.gear||[]).length+' items carried.</b> Tap an item to remove it.</p>';let chosen=w.G.filter(g=>(w.s.gear||[]).includes(g[0]));list.innerHTML=chosen.length?chosen.map(g=>'<button class="sel" onclick="tg(\''+g[0].replaceAll("'","\\'")+'\')"><b>'+g[0]+'</b><br>d'+g[1]+' • '+g[2]+'</button>').join(''):'<p class="mut">No gear selected. Return to Gear Catalog.</p>'}refreshStatus()}d.getElementById('gearCatalogTab').onclick=()=>{mode='catalog';draw()};d.getElementById('gearLoadoutTab').onclick=()=>{mode='loadout';draw()};let oldTg=w.tg;w.tg=function(n){oldTg(n);draw()};let next=d.createElement('div');next.innerHTML='<div class="card"><div class="flowButtons"><button onclick="show(\'skills\')">← BACK: SKILLS</button><button class="nextBtn" onclick="show(\'play\')">NEXT: CHARACTER / PLAY →</button></div></div>';gearCard.after(next);draw()}
installStatus();let oldRank=w.rank;w.rank=function(n,x){oldRank(n,x);refreshStatus()};let oldShow=w.show;w.show=function(id){oldShow(id);refreshStatus()};
}catch(e){console.error('P7 flow patch',e)}};
</script></body></html>
