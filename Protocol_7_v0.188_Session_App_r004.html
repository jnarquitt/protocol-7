<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Protocol 7 v0.188 Session App r004</title><style>html,body{margin:0;width:100%;height:100%;background:#0d0b0b}#app{display:block;width:100%;height:100%;border:0}.badge{position:fixed;right:8px;top:7px;z-index:20;background:#8e2d2d;color:#fff;padding:4px 7px;border-radius:7px;font:700 11px system-ui;pointer-events:none}</style></head><body><div class="badge">r004 PLAYTEST</div><iframe id="app" src="./Protocol_7_v0.188_Session_App_r003.html?v=r004"></iframe><script>
const f=document.getElementById('app');f.addEventListener('load',()=>{const w=f.contentWindow,d=f.contentDocument;if(!d||d.getElementById('r004patch'))return;const st=d.createElement('style');st.id='r004patch';st.textContent=`.r4panel{background:#171313;border:2px solid #705a45;border-radius:12px;padding:12px;margin:10px 0}.r4grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.r4action{background:#352a22!important;border:1px solid #8c714f!important}.r4small{font-size:.78rem;color:#c6b9a6}.r4family{margin:4px 2px}.r4modal{position:fixed;inset:0;background:#0d0b0bf5;z-index:9999;overflow:auto;padding:12px;box-sizing:border-box}.r4modal button{margin:3px}.r4vam{background:#191515;border:1px solid #493b32;border-radius:10px;padding:10px;margin:7px 0}.r4close{position:sticky;top:0;width:100%;z-index:2;background:#8e2d2d!important}`;d.head.appendChild(st);
function byText(sel,t){return [...d.querySelectorAll(sel)].find(x=>x.textContent.trim().startsWith(t))}
function chooseSkill(name){const s=d.getElementById('rollSkill');if(!s)return;s.value=name;s.dispatchEvent(new Event('change',{bubbles:true}));s.scrollIntoView({behavior:'smooth',block:'center'})}
const play=d.getElementById('play');if(play){const rollCard=d.getElementById('rollSkill')?.closest('.card');if(rollCard){const q=d.createElement('div');q.className='r4panel';q.innerHTML='<h3>Quick Actions</h3><p class="r4small">Tap an action to configure its Skill in the Roll Builder. The GM still sets Difficulty and decides situational Advantage/Disadvantage.</p><div class="r4grid"><button class="r4action" data-s="Sidearms">SIDEARM ATTACK</button><button class="r4action" data-s="Longarms">LONGARM ATTACK</button><button class="r4action" data-s="Unarmed">UNARMED</button><button class="r4action" data-s="Light Melee">LIGHT MELEE</button><button class="r4action" data-s="Grappling">GRAPPLE</button><button class="r4action" data-s="Dodge">DODGE</button><button class="r4action" data-s="Perception">PERCEPTION</button><button class="r4action" data-s="Investigation">INVESTIGATE</button></div>';q.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>chooseSkill(b.dataset.s));rollCard.parentNode.insertBefore(q,rollCard)}
const turn=[...play.querySelectorAll('.card')].find(x=>x.textContent.includes('Your Turn'));if(turn){const guide=d.createElement('div');guide.className='r4panel';guide.innerHTML='<h3>What Can I Do?</h3><div class="r4grid"><button class="r4action" data-s="Sidearms">ATTACK • 1 AP</button><button class="r4action" id="r4aim">AIM • 1 AP</button><button class="r4action" id="r4cover">TAKE COVER • 1 AP</button><button class="r4action" data-s="Grappling">GRAPPLE • 1 AP</button><button class="r4action" data-s="Medicine">AID / MEDICINE</button><button class="r4action" id="r4interact">INTERACT</button></div><p class="r4small">Movement remains 30 feet per AP. Loaded VAM cards above may change costs or create special options when their triggers apply.</p>';guide.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>chooseSkill(b.dataset.s));guide.querySelector('#r4aim').onclick=()=>alert('Aim selected. Apply the current v0.188 Aim rule; loaded VAMs such as Snap Shot may modify the next qualifying attack.');guide.querySelector('#r4cover').onclick=()=>alert('Take Cover selected. Cover and loaded VAMs such as Cover Protocol may affect the next appropriate defense.');guide.querySelector('#r4interact').onclick=()=>alert('Interact with an accessible object when the fiction permits. The GM calls for a roll only when outcome is uncertain.');turn.parentNode.insertBefore(guide,turn)}
const rb=byText('button','REACTION');if(rb){rb.onclick=(ev)=>{ev.preventDefault();ev.stopPropagation();const old=d.getElementById('r4reactmenu');if(old){old.remove();return}const m=d.createElement('div');m.id='r4reactmenu';m.className='r4panel';m.innerHTML='<h3>Reaction</h3><p>Choose the reaction that the current situation and your rules/VAMs permit.</p><div class="r4grid"><button data-s="Dodge">DODGE</button><button data-s="Reflex">REFLEX</button><button data-s="Fortitude">FORTITUDE</button><button data-s="Will">WILL</button></div><p class="r4small">Some loaded VAMs provide their own Reaction. Open the VAM card before spending the Reaction.</p><button id="r4spend">SPEND REACTION</button>';m.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>chooseSkill(b.dataset.s));m.querySelector('#r4spend').onclick=()=>{try{w.reaction()}catch(e){}m.remove()};rb.parentNode.parentNode.appendChild(m)}}}
const skills=d.getElementById('skills');if(skills){const h=skills.querySelector('h2');if(h){const note=d.createElement('div');note.className='r4panel';note.innerHTML='<b>Preset safety</b><p class="r4small">A preconfigured Vector already has 20 legal ranks. Review the pools before changing them. If you edit, the 20-rank meter is the authority.</p>';h.after(note)}}
const vams=d.getElementById('vams');if(vams){const h=vams.querySelector('h2');const btn=d.createElement('button');btn.className='wide';btn.textContent='BROWSE FULL 84-VAM CANONICAL CATALOG';btn.onclick=showCatalog;h.after(btn)}
async function showCatalog(){let modal=d.createElement('div');modal.className='r4modal';modal.innerHTML='<button class="r4close">CLOSE CATALOG</button><h2>Canonical VAM Catalog</h2><p class="r4small">Reference browser for the full v0.188 canonical database. Your active loadout remains managed on the VAM Loadout screen.</p><div id="r4cats">Loading…</div>';d.body.appendChild(modal);modal.querySelector('.r4close').onclick=()=>modal.remove();try{let j=await fetch('./PROJECT_DOCUMENTATION/APP_REBUILD/P7_v0.188_VAM_CANONICAL_DATABASE_r001.json').then(r=>r.json());let host=modal.querySelector('#r4cats');let fam='ALL';host.innerHTML='<div id="r4filters"></div><div id="r4items"></div>';let fs=['ALL',...j.families];host.querySelector('#r4filters').innerHTML=fs.map(x=>`<button class="r4family" data-f="${x}">${x.replaceAll('_',' ')}</button>`).join('');function draw(){let a=fam==='ALL'?j.vams:j.vams.filter(v=>v.family===fam);host.querySelector('#r4items').innerHTML=`<p><b>${a.length}</b> VAMs shown • database total ${j.count}</p>`+a.map(v=>`<div class="r4vam"><b>${v.name}</b> • ${v.bar} BAR • Level ${v.level}<br><span class="r4small">${v.family.replaceAll('_',' ')} • Trigger: ${String(v.trigger||v.activation?.ap?('AP '+v.activation.ap):'see effect').replaceAll('_',' ')}</span></div>`).join('')}host.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{fam=b.dataset.f;draw()});draw()}catch(e){modal.querySelector('#r4cats').textContent='Catalog could not be loaded. Return to the landing page and reopen r004.'}}
});
</script></body></html>
