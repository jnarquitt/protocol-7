<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Protocol 7 v0.188 Current Playtest</title><style>html,body{margin:0;width:100%;height:100%;background:#0d0b0b}#app{display:block;width:100%;height:100%;border:0}.badge{position:fixed;right:8px;top:7px;z-index:140;background:#8e2d2d;color:#fff;padding:4px 7px;border-radius:7px;font:700 11px system-ui;pointer-events:none}</style></head><body><div class="badge">v0.188 CURRENT</div><iframe id="app" src="./Protocol_7_v0.188_Session_App_r014.html?v=r015"></iframe><script>
const a=document.getElementById('app');a.addEventListener('load',()=>{let b=a.contentDocument?.getElementById('app'),c=b?.contentDocument?.getElementById('app'),e=c?.contentDocument?.getElementById('app');if(!e)return;const patch=()=>{let d=e.contentDocument,w=e.contentWindow;if(!d||d.getElementById('r015'))return;let st=d.createElement('style');st.id='r015';st.textContent='.r15{background:#171313;border:2px solid #8a704d;border-radius:12px;padding:12px;margin:10px 0}.r15grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.r15small{font-size:.8rem;color:#c6b9a6}.r15lead{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center}.r15lead button{font-size:1.5rem}.r15meter{text-align:center;font-weight:900;font-size:1.15rem;padding:10px;background:#211b19;border-radius:8px}.r15note{padding:8px;border-left:4px solid #d7a82d;background:#211b19;margin-top:8px}';d.head.appendChild(st);const KEY='p7v188r003',UI='p7v188ui';function U(){try{return JSON.parse(localStorage.getItem(UI)||'{}')}catch(x){return {}}}function us(x){localStorage.setItem(UI,JSON.stringify(x))}function skill(n){let rs=d.getElementById('rollSkill');if(rs){rs.value=n;rs.dispatchEvent(new Event('change',{bubbles:true}));try{w.poolUI()}catch(x){}d.getElementById('pool')?.scrollIntoView({behavior:'smooth',block:'center'})}}
let play=d.getElementById('play');if(!play)return;let box=d.createElement('div');box.className='r15';box.innerHTML='<h3>What are you trying to do?</h3><p class="r15small">Choose the intention first. The app will show the rule underneath.</p><div class="r15grid"><button id="r15protect">PROTECT AN ALLY<br><span class="r15small">Reaction • Intercept</span></button><button id="r15chase">CHASE SOMEONE<br><span class="r15small">Foot • Vehicle • Mount</span></button><button id="r15ambush">SET / RESPOND TO AMBUSH<br><span class="r15small">Position + Advantage</span></button><button id="r15hazard">SURVIVE A HAZARD<br><span class="r15small">Reflex • Fortitude • Survival</span></button></div><div id="r15detail"></div>';let first=play.querySelector('.r14')||d.getElementById('rollSkill')?.closest('.card');first?play.insertBefore(box,first):play.appendChild(box);let detail=box.querySelector('#r15detail');box.querySelector('#r15protect').onclick=()=>{detail.innerHTML='<div class="r15note"><b>Protect Ally</b><br>Spend your Reaction when you can plausibly reach/interpose. You become the defender and use your appropriate active defense. This does not give a free counterattack.</div>'};box.querySelector('#r15ambush').onclick=()=>{detail.innerHTML='<div class="r15note"><b>Ambush</b><br>Good hidden position can grant Advantage to the opening action or impose Disadvantage when response is genuinely compromised. No separate surprise round. Once revealed, use normal action economy.</div>'};box.querySelector('#r15hazard').onclick=()=>{detail.innerHTML='<div class="r15note"><b>Survive a Hazard</b><br><button data-h="Reflex">SUDDEN DANGER — REFLEX</button> <button data-h="Fortitude">ENDURE — FORTITUDE</button> <button data-h="Survival">EXPOSURE / FIELDCRAFT — SURVIVAL</button></div>';detail.querySelectorAll('[data-h]').forEach(x=>x.onclick=()=>skill(x.dataset.h))};box.querySelector('#r15chase').onclick=()=>{let u=U();if(typeof u.lead!=='number')u.lead=0;us(u);detail.innerHTML='<div class="r15note"><b>Chase</b><p class="r15small">Use this only when relative position matters. Choose how you are pursuing, then resolve the opposed roll in the normal Roll Builder.</p><div class="r15grid"><button data-c="Athletics">ON FOOT<br><span class="r15small">Athletics</span></button><button data-c="Driving">VEHICLE<br><span class="r15small">Driving</span></button><button data-c="Riding">MOUNT<br><span class="r15small">Riding</span></button><button data-c="other">OTHER APPROACH<br><span class="r15small">Choose Skill below</span></button></div><h4>Lead</h4><div class="r15lead"><button id="r15minus">−</button><div class="r15meter" id="r15meter"></div><button id="r15plus">+</button></div><p class="r15small">−3 = quarry escapes • 0 = contested • +3 = pursuer catches. Normal win shifts 1; Powerful/Overwhelming win shifts 2.</p></div>';function meter(){let x=U().lead||0;detail.querySelector('#r15meter').textContent=(x>0?'+':'')+x}meter();detail.querySelectorAll('[data-c]').forEach(x=>x.onclick=()=>{if(x.dataset.c!=='other')skill(x.dataset.c);else d.getElementById('rollSkill')?.scrollIntoView({behavior:'smooth',block:'center'})});detail.querySelector('#r15minus').onclick=()=>{let u=U();u.lead=Math.max(-3,(u.lead||0)-1);us(u);meter()};detail.querySelector('#r15plus').onclick=()=>{let u=U();u.lead=Math.min(3,(u.lead||0)+1);us(u);meter()}};
};setTimeout(patch,500);e.addEventListener('load',patch)});</script></body></html>
