<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Protocol 7 v0.188 Current Session App</title><style>html,body{margin:0;width:100%;height:100%;background:#0d0b0b}#shell{display:block;width:100%;height:100%;border:0}.badge{position:fixed;right:8px;top:7px;z-index:70;background:#8e2d2d;color:#fff;padding:4px 7px;border-radius:7px;font:700 11px system-ui;pointer-events:none}</style></head><body><div class="badge">v0.188 CURRENT</div><iframe id="shell" src="./Protocol_7_v0.188_Session_App_r007.html?v=r008"></iframe><script>
const shell=document.getElementById('shell');shell.addEventListener('load',()=>{let d1=shell.contentDocument,i1=d1&&d1.getElementById('shell'),d2=i1&&i1.contentDocument,i2=d2&&d2.getElementById('shell'),d3=i2&&i2.contentDocument,inner=d3&&d3.getElementById('app');if(!inner)return;const patch=()=>{const d=inner.contentDocument,w=inner.contentWindow;if(!d||d.getElementById('r008patch'))return;let st=d.createElement('style');st.id='r008patch';st.textContent='.r8modal{position:fixed;inset:0;background:#0d0b0bf8;z-index:999999;overflow:auto;padding:12px;box-sizing:border-box}.r8modal .card{max-width:720px;margin:10px auto}.r8grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.r8sel{outline:3px solid #d4a72c}.r8bar{height:12px;background:#3b3230;border-radius:9px;overflow:hidden}.r8bar i{display:block;height:100%;background:#d4a72c}.r8small{font-size:.8rem;color:#c6b9a6}';d.head.appendChild(st);function B(){try{return JSON.parse(localStorage.getItem('p7v188r003')||'{}')}catch(e){return {}}}function M(){try{return JSON.parse(localStorage.getItem('p7r005meta')||'{}')}catch(e){return {}}}function sb(x){localStorage.setItem('p7v188r003',JSON.stringify(x))}function sm(x){localStorage.setItem('p7r005meta',JSON.stringify(x))}let btn=[...d.querySelectorAll('button')].find(x=>x.textContent.trim()==='GUIDED LEVEL UP');if(btn){btn.textContent='LEVEL UP';btn.onclick=advance}
function advance(){let s=B(),m=M(),level=m.level||s.level||1,next=level+1;if(next>6){alert('Current v0.188 playtest progression ends at Level 6.');return}let tempRanks=JSON.parse(JSON.stringify(s.ranks||{})),spent=0,special=null;let mod=d.createElement('div');mod.className='r8modal';let specialLabel=next===2?'Choose one Edge':(next===3||next===5)?'Increase one Ability one step':'Choose one Skill to Master';mod.innerHTML=`<button class="wide" id="r8cancel">CANCEL — NO CHANGES</button><div class="card"><h2>Advance to Level ${next}</h2><p><b>Automatic on completion:</b> +4 maximum HP • BAR ${[16,18,21,24,27,30][next-1]}</p><h3>1. ${specialLabel}</h3><div id="r8special" class="r8grid"></div><h3>2. Spend 4 Skill Ranks</h3><div class="r8bar"><i id="r8fill" style="width:0%"></i></div><p><b><span id="r8left">4</span> remaining</b></p><div id="r8skills" class="r8grid"></div><p class="r8small">All choices are staged. Nothing changes on the Vector until COMPLETE LEVEL ${next} is pressed.</p><button class="wide" id="r8done" disabled>COMPLETE LEVEL ${next}</button></div>`;d.body.appendChild(mod);mod.querySelector('#r8cancel').onclick=()=>mod.remove();let spec=mod.querySelector('#r8special');if(next===2){let edges={Driven:'Once/session reroll one die after rolling; keep new result.',Inspired:'Once/session gain Advantage before a roll.',Prepared:'Once/session declare reasonable ordinary preparation.',Connected:'Once/session establish plausible useful contact/access.',Durable:'Persistent +5 maximum HP.'};spec.innerHTML=Object.entries(edges).map(([n,t])=>`<button data-sp="${n}"><b>${n}</b><br><span class="r8small">${t}</span></button>`).join('')}else if(next===3||next===5){let ab=s.abilities||{},step={4:6,6:8,8:10,10:12};spec.innerHTML=['STR','DEX','CON','INT','WIS','CHA'].map(n=>`<button data-sp="${n}" ${(ab[n]||4)>=12?'disabled':''}>${n}<br>d${ab[n]||4} → ${(ab[n]||4)>=12?'MAX':'d'+step[ab[n]||4]}</button>`).join('')}else{let mastered=m.mastered||[];spec.innerHTML=Object.keys(tempRanks).filter(n=>!mastered.includes(n)).sort().map(n=>`<button data-sp="${n}">${n}</button>`).join('')}spec.querySelectorAll('[data-sp]').forEach(x=>x.onclick=()=>{special=x.dataset.sp;spec.querySelectorAll('button').forEach(z=>z.classList.remove('r8sel'));x.classList.add('r8sel');check()});function skills(){let names=Object.keys(tempRanks).sort((a,b)=>(tempRanks[b]||0)-(tempRanks[a]||0));mod.querySelector('#r8skills').innerHTML=names.map(n=>`<button data-sk="${n}" ${(tempRanks[n]||0)>=10||spent>=4?'disabled':''}>+ ${n}<br><span class="r8small">${tempRanks[n]||0} ranks</span></button>`).join('');mod.querySelectorAll('[data-sk]').forEach(x=>x.onclick=()=>{if(spent>=4)return;tempRanks[x.dataset.sk]=(tempRanks[x.dataset.sk]||0)+1;spent++;skills();check()});mod.querySelector('#r8left').textContent=4-spent;mod.querySelector('#r8fill').style.width=(spent*25)+'%'}function check(){mod.querySelector('#r8done').disabled=!(special&&spent===4)}skills();mod.querySelector('#r8done').onclick=()=>{let map={4:6,6:8,8:10,10:12};s.ranks=tempRanks;s.maxhp=(s.maxhp||s.hp||18)+4;s.hp=Math.min((s.hp||s.maxhp),s.maxhp-4)+4;s.barCap=[16,18,21,24,27,30][next-1];s.level=next;m.level=next;m.mastered=m.mastered||[];if(next===2){m.edge=special;if(special==='Durable'){s.maxhp+=5;s.hp+=5}}else if(next===3||next===5){s.abilities=s.abilities||{};s.abilities[special]=map[s.abilities[special]||4]||s.abilities[special]}else{m.mastered.push(special)}m.history=m.history||[];m.history.push({level:next,date:new Date().toISOString(),special:special,skillRanksSpent:4,maxHP:s.maxhp,bar:s.barCap});sb(s);sm(m);mod.remove();alert(`Level ${next} complete. ${special} selected; 4 Skill Ranks spent; maximum HP +4; BAR ${s.barCap}.`);try{w.render()}catch(e){}}}
const play=d.getElementById('play');if(play){let history=d.createElement('div');history.className='r7';history.innerHTML='<h3>Advancement History</h3><div id="r8history"></div>';play.appendChild(history);function hist(){let m=M(),h=m.history||[];history.querySelector('#r8history').innerHTML=h.length?h.map(x=>`<div><b>Level ${x.level}</b> — ${x.special||x.benefit||'Advancement'} <span class="r8small">• ${x.skillRanksSpent||4} Skill Ranks • BAR ${x.bar||''}</span></div>`).join(''):'<span class="r8small">No advancements recorded yet.</span>'}hist()}
};if(inner.contentDocument?.readyState==='complete')patch();inner.addEventListener('load',patch)});</script></body></html>
