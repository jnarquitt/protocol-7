ation":"Perception","Pattern Index":"Investigation","Memory Cueing":"Investigation","Period Native":"Culture","Vocal Control":"Influence","Language Scaffold":"Linguistics","Fine Motor Assist":"Security","Threat Map":"Tactics","Fast Draw":"Sidearms","Threat Focus":"Perception","Snap Shot":"Sidearms","Balance Assist":"Acrobatics","Combat Rescue":"Athletics"}[name];goPlay(skill);setTimeout(()=>alert(skill?`${name} selected as context for ${skill}. Review the assembled pool on PLAY before rolling.`:`${name} is loaded. Review its play card/effect on PLAY; it does not create a separate rolling screen.`),100)})}
