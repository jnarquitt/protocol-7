bilize:2,Grapple:2,Disarm:2},era_neutral_actions:`AP costs describe the action rather than the technology. Normal Attack is 1 AP across eras; specific weapons, VAMs, conditions, and special maneuvers may override.`,gear_navigation:{subtabs:[`Armor`,`Weapons`,`Tools`,`Loadout`],armor_items:[`Protective Vest`,`Ballistic Vest`,`Tactical Armor`],loadout:`Shows currently selected armor, weapons, and tools in one play-oriented summary.`,play_armor_summary:`Selected armor is persistently summarized on Play.`},movement:{cost_ap:1,distance_feet:30,repeatable:!0,rule:`Spend 1 AP to move up to 30 feet. Each additional AP spent on Move grants another movement of up to 30 feet. There is no separate universal Run action.`},ui_mobile_layout:{viewport:`width=device-width, initial-scale=1, viewport-fit=cover`,horizontal_gutter_px:6,desktop_gutter_px:8,intent:`Use nearly the full phone viewport so the character sheet opens at a readable scale without pinch-resizing.`},pdf_mobile_layout:{uniform_page_size:`6 x 9 inches (432 x 648 points)`,visible_horizontal_crop_points_each_side:18,approx_visible_gutter_inches:.25,normalization:`Letter pages are proportionally reduced and centered on 6 x 9 pages; native 6 x 9 pages remain at native scale.`,intent:`Keep every page physically identical and keep horizontal margins narrow on every section so phone viewers stay at one zoom level.`},ui_vam_subtabs:{basis:`Restored intact v1.73 main-tab and VAM-tab structure.`,fix:`Existing VAM category buttons now use explicit type=button, data-vam-category, and a minimal button handler.`,preserved:[`main TABS array`,`renderTabs()`,`showTab()`,`VAM preset controls`,`BAR meter`,`BAR jump controls`,`existing renderVams() layout`]},ui_gear_subtabs:{tabs:[`Armor`,`Weapons`,`Tools`,`Loadout`],inactive_style:`dark background, pale-gold text, gold border`,active_style:`red background, white text, bright-gold border`,mobile:`horizontal scrolling, explicit type=button, touch-action manipulation`,handler_fix:`Gear buttons now use data-gear-view plus setGearViewFromButton(this), avoiding fragile quoted inline arguments.`},vam_design_audit:{principle:`High-identity VAMs should change permission, information, action economy, reactions, or decision space more often than simply adding another die.`,revised_in_0_180:[`Period Native`,`Counterintelligence`,`Fine Motor Stabilizer`,`Balance Assist`,`Grip Assist`,`Breath Control`,`Stress Governor`,`Sensory Filter`,`Vocal Control`,`Microexpression Read`,`Pattern Index`,`Memory Cueing`,`Low-Light Adaptation`,`Social Mirroring`,`Chronometric Focus`,`Route Modeling`],unchanged_modifier_vams:`Some narrow modifier VAMs remain intentionally; the goal is not to eliminate every bonus die.`},canonical_terms:{"Protocol Dice":`The resolution engine: build one complete pool, roll once, results 1-3 are blank, and every 4+ scores at face value.`,Ability:`One of STR, DEX, CON, INT, WIS, CHA. A Skill specifies the three Ability dice used in its pool.`,Skill:`Learned expertise. A Skill determines its three associated Ability dice and contributes its Skill die; untrained is d4.`,"Gear Die":`The die from one primary relevant weapon, tool, or armor item. Compatible gear does not stack unless a rule explicitly permits it.`,VAM:`A biocognitive augmentation module that occupies BAR capacity and grants a defined capability; it does not install a profession.`,BAR:`Biocognitive Augmentation Rating: capacity, not energy. Standard active capacity is 16 BAR.`,AP:`Action Points. A Vector normally has 3 per turn.`,Reaction:`One response between turns unless a rule grants more. A Reaction may spend up to 1 AP, using unspent AP first and borrowing from the next turn only if none remains.`,Advantage:`Adds d4/d6/d8 for minor/clear/major favorable circumstances.`,Disadvantage:`Removes d4/d6/d8; if absent, remove the next-highest die present, or the highest available if no higher die exists. Never reduce below one die.`,"Die Step Effect":`Changes a specific Ability die before pool construction on d4-d6-d8-d10-d12.`,"Historical Carrier":`The person, copy, object, record, institution, process, or network that must transmit the mission-critical fact or consequence forward through history.`,Exposure:`Durable anomalous evidence left in the era: witnesses, records, artifacts, impossible injuries, or institutional knowledge.`,Vector:`A Protocol 7 field operative acting in a historical era under Aletheia mission authority.`,Insertion:`Aletheia places a Vector at a precise historical moment through temporal transit; exceptional terminal-host insertion requires authorization, exact surveillance, and Thanatic Anchor.`},mission_procedure:[{phase:`Briefing`,purpose:`Interpret the Apocryphon, identify what is known, and define the mission constraint without pretending the answer is already solved.`},{phase:`Insertion`,purpose:`Enter at the authorized time/place and account for arrival signatures, witnesses, and immediate safety.`},{phase:`Establish Cover`,purpose:`Acquire a plausible identity, role, equipment posture, and reason to be where the mission requires.`},{phase:`Investigate`,purpose:`Gather people, records, artifacts, and context. Essential clues are never locked behind a single success.`},{phase:`Identify Leverage`,purpose:`Determine what person, decision, object, institution, or transmission route can actually change the Carrier.`},{phase:`Intervene`,purpose:`Act on the leverage point. Resolve the immediate obstacle while tracking consequences.`},{phase:`Establish Carrier`,purpose:`Create, strengthen, or protect the required Historical Carrier through independent transmission routes.`},{phase:`Contain Exposure`,purpose:`Remove, explain, discredit, retrieve, or isolate anomalous evidence without erasing the Carrier.`},{phase:`Extract`,purpose:`Reach the extraction condition without abandoning the required Carrier or creating avoidable evidence.`},{phase:`Historical Verification`,purpose:`Aletheia checks whether the required Carrier survived and what Exposure propagated into the resulting history.`}],historical_carrier_rules:{states:[`Fragile`,`Established`,`Durable`],improve:`Improve one step only when the fiction creates or protects an additional independent transmission route, archive, witness chain, institutional adoption, repeatable demonstration, or similarly durable support. A successful relevant action is normally required when uncertainty matters.`,weaken:`Reduce one step when an independent route is destroyed, discredited, severed, suppressed, or made dependent on a single vulnerable point.`,overwhelming:`An Overwhelming success may improve a directly affected Carrier one step as its extra benefit when the action actually established or protected it.`,exposure_tradeoff:`If strengthening the Carrier requires public dissemination, institutional filing, impossible technology, conspicuous intervention, or additional witnesses, the GM may also increase Exposure. Stronger Carrier and lower Exposure are intentionally competing goals.`,mission_requirement:`Each operation states the minimum Carrier strength that must survive historical verification.`},mission_outcome_matrix:[{carrier_met:!0,exposure_within_target:!0,result:`Clean Success`,meaning:`Required history survives and anomalous evidence remains within the mission tolerance.`},{carrier_met:!0,exposure_within_target:!1,result:`Exposed Success`,meaning:`The mission objective survives, but anomalous evidence creates investigation, future complications, or altered history.`},{carrier_met:!1,exposure_within_target:!0,result:`Contained Failure`,meaning:`The intervention fails to preserve the required Carrier, but temporal contamination remains limited.`},{carrier_met:!1,exposure_within_target:!1,result:`Exposed Failure`,meaning:`The Carrier fails and evidence of intervention survives - the most dangerous result.`}],equipment_templates:[{template:`Concealable Weapon`,job:`Easy to hide/carry; modest gear die; discovery is usually a social/legal problem rather than a battlefield one.`,examples:`dagger / compact pistol / compact future sidearm`},{template:`Melee Weapon`,job:`Close engagement, parry/control permissions where fiction supports them.`,examples:`sword / baton / combat blade`},{template:`Service Ranged Weapon`,job:`General-purpose ranged attack with an era-appropriate loading/ready procedure.`,examples:`bow / musket / service pistol / carbine / coil rifle`},{template:`Precision Weapon`,job:`Deliberate long-range attack; full benefit depends on visibility, stability, and appropriate range.`,examples:`longbow in prepared position / scoped rifle / future precision system`},{template:`Area or Automatic Weapon`,job:`Suppression, multiple-target or area permissions when a specific rule permits them; conspicuous and difficult to conceal.`,examples:`sling volley / machine gun / future area projector`},{template:`Heavy Weapon`,job:`High-impact or crew-scale system; often requires setup, bracing, carrying support, or unusual sourcing.`,examples:`siege tool / launcher / crew-served weapon`},{template:`Protective Armor`,job:`Adds its listed gear die to an appropriate defense when it can physically protect the Vector; no second universal damage reduction.`,examples:`mail / ballistic vest / tactical armor`},{template:`Specialist Tool`,job:`One primary tool die to the relevant Skill when the tool materially contributes.`,examples:`lock tools / field medical kit / scanner / engineering kit`}],playtest_locks:[`Three associated Ability dice per Skill pool, including repeated Abilities.`,`Untrained Skill die is d4; current cumulative Skill Rank breakpoints remain fixed for the next structured playtest.`,`Maximum HP = CON die maximum x 3.`,`3 AP per turn; normal Attack costs 1 AP.`,`Move costs 1 AP for up to 30 feet and may be repeated; there is no universal Run action.`,`One normal Reaction between turns; spend unspent AP first, then borrow at most 1 AP from the next turn if needed.`,`One primary gear die per Skill roll unless a specific rule explicitly permits stacking.`,`Armor contributes to an appropriate defense pool and does not also reduce damage by default.`],release_validation:{rule:`No feature release is complete until main tabs, subtabs, creation, save/reload, AP/Reaction, VAM loading, gear selection, Roller, Mission, and Learn/Rules pass the included smoke test and manual checklist.`},release_channel:`pre-beta`,artifact_separation:{player_files:`Character sheet and rulebook contain only player/GM-facing game material.`,project_documentation:`Validation, smoke tests, design locks, release notes, and internal development notes are packaged separately.`},era_gear_presets:JSON.parse(`{"decades":["1900s","1910s","1920s","1930s","1940s","1950s","1960s","1970s","1980s","1990s","2000s","2010s","2020s"],"coverage":"Every starting configuration plus Custom has a populated loadout for all 10 decades of the 20th century and the 2000s, 2010s, and 2020s.","exact_year_rule":"A decade preset is a representative starting point, not a universal availability claim. Exact year, geography, profession, legality, wartime status, and local access may shift individual items; ordinary period-plausible substitutions do not inherently create Exposure.","saved_character_migration":"Legacy Late 20th Century selections migrate to 1990s. v0.180 local character data migrates automatically to the v0.181 storage key.","profiles":{"1900s":{"years":"1900-1909","summary":"Telegraph and landline telephone dominate long-distance coordination; records are paper-first; photography is film/plate based; automobiles exist but are not assumed everywhere.","communications":"telegraph forms, landline telephone access, coded messenger arrangements","imaging":"plate or roll-film camera, tripod, spare plates or film","technical":"measuring tape, calipers, hand tools, transit/level as appropriate","laboratory":"sample bottles, stains/reagents, hand lens or microscope access","records":"city directories, newspapers, ledger erence Kit","Field Notebook","Civilian Backpack"],"Engineer":["Compact Pistol","Multitool","Laptop / Tablet","Period Records & Reference Kit","Field Notebook","Flashlight","Civilian Backpack"],"Scientist":["Compact Pistol","Period Laboratory Kit","Laptop / Tablet","Digital Camera","Period Records & Reference Kit","Field Notebook","Civilian Backpack"],"Medic":["Compact Pistol","Field Medical Kit","First Aid Pouch","Protective Vest","Encrypted Radio","Civilian Backpack"],"Recon":["Compact Pistol","Carbine","Compact Binoculars","Digital Camera","Encrypted Radio","Period Navigation Kit","Climbing Kit","Protective Vest","Civilian Backpack"],"Close Protection":["Service Pistol","Protective Vest","Encrypted Radio","Field Medical Kit","Plainclothes Concealment Rig","Civilian Backpack"],"Breacher":["Service Pistol","Shotgun","Protective Vest","Period Breaching Kit","Multitool","Encrypted Radio","Flashlight","Civilian Backpack"],"Control Specialist":["Compact Pistol","Baton","Protective Vest","Encrypted Radio","First Aid Pouch","Plainclothes Concealment Rig","Civilian Backpack"],"Command":["Compact Pistol","Protective Vest","Encrypted Radio","Period Credentials & Stationery","Laptop / Tablet","Period Records & Reference Kit","Field Notebook","Civilian Backpack"],"Precision Shooter":["Compact Pistol","Precision Rifle","Compact Binoculars","Protective Vest","Encrypted Radio","Period Navigation Kit","Civilian Backpack"],"Temporal Analyst":["Compact Pistol","Period Records & Reference Kit","Digital Camera","Field Notebook","Encrypted Radio","Laptop / Tablet","Civilian Backpack"],"Custom":["Compact Pistol","Encrypted Radio","Flashlight","First Aid Pouch","Field Notebook","Civilian Backpack"]},"2020s":{"Field Operator":["Service Pistol","Carbine","Protective Vest","Encrypted Radio","Smartphone","Field Medical Kit","Flashlight","Civilian Backpack"],"Infiltrator":["Compact Pistol","Plainclothes Concealment Rig","Smartphone","Period Intrusion Kit","Laptop / Tablet","Multitool","Period Currency Kit","Civilian Backpack"],"Investigator":["Compact Pistol","Forensic Kit","Evidence Bags & Swabs","Digital Camera","Smartphone","Field Notebook","Flashlight","Civilian Backpack"],"Diplomat":["Compact Pistol","Plainclothes Concealment Rig","Smartphone","Laptop / Tablet","Period Currency Kit","Field Notebook","Civilian Backpack"],"Engineer":["Compact Pistol","Universal Interface Kit","Laptop / Tablet","Multitool","Precision Chronometer","Flashlight","Civilian Backpack"],"Scientist":["Compact Pistol","Laptop / Tablet","Precision Chronometer","Digital Camera","Field Notebook","Evidence Bags & Swabs","Civilian Backpack"],"Medic":["Compact Pistol","Field Medical Kit","First Aid Pouch","Protective Vest","Smartphone","Encrypted Radio","Civilian Backpack"],"Recon":["Compact Pistol","Carbine","Compact Binoculars","Digital Camera","Encrypted Radio","Smartphone","Climbing Kit","Civilian Backpack"],"Close Protection":["Service Pistol","Protective Vest","Encrypted Radio","Smartphone","Field Medical Kit","Plainclothes Concealment Rig","Civilian Backpack"],"Breacher":["Service Pistol","Shotgun","Protective Vest","Period Intrusion Kit","Multitool","Encrypted Radio","Flashlight","Civilian Backpack"],"Control Specialist":["Compact Pistol","Baton","Protective Vest","Encrypted Radio","First Aid Pouch","Plainclothes Concealment Rig","Civilian Backpack"],"Command":["Compact Pistol","Protective Vest","Encrypted Radio","Smartphone","Laptop / Tablet","Field Notebook","Civilian Backpack"],"Precision Shooter":["Compact Pistol","Precision Rifle","Compact Binoculars","Protective Vest","Encrypted Radio","Smartphone","Civilian Backpack"],"Temporal Analyst":["Compact Pistol","Laptop / Tablet","Precision Chronometer","Digital Camera","Field Notebook","Smartphone","Civilian Backpack"],"Custom":["Compact Pistol","Smartphone","Flashlight","First Aid Pouch","Field Notebook","Civilian Backpack"]}}}`)},b={fiction:[{type:`heading`,level:2,text:`OPENING FICTION THE LAST VETO`},{type:`paragraph`,text:`A Protocol 7 novelette The first time humanity told Aletheia no, 11,403 people died. The second time, fewer people died. Some leaders called that progress.`},{type:`heading`,level:3,text:`1. The Last Veto`},{type:`paragraph`,text:`Dr. Mara Venn stared at the two buttons in front of her. One was green. One was red.`},{type:`heading`,level:3,text:`AUTHORIZE. DENY.`},{type:`paragraph`,text:`There were eighty-seven people in the chamber. Presidents sat beside bankers. Generals sat beside scientists. A few of the richest people on Earth had seats too. Years ago, when the group was still secret, they had called themselves the Continuity Commission.`},{type:`paragraph`,text:`Now most of the world simply called them the Assembly. Above the chamber, a wall of white light came alive.`},{type:`heading`,level:3,text:`PROTOCOL SEVEN: CONDITIONS SATISFIED`},{type:`paragraph`,text:`REQUEST FOR AUTHORIZATION Mara's stomach tightened. Twenty-three years earlier, she had helped activate Protocol One. Back then, Aletheia had been a new kind of artificial intelligence, built in secret to answer a frightening question.`},{type:`paragraph`,text:`Something was growing near Jupiter. At first astronomers thought it was dust. Then they saw long threads spreading through space. The threads joined together. They reacted to sunlight and magnetic fields. They grew. People started calling it the Bloom.`},{type:`paragraph`,text:`Aletheia had been created to learn whether the Bloom could hurt Earth and, if it could, find a way to stop it. That was only part of the truth. A small group inside the Commission had another plan. They believed the nations of Earth would never cooperate well enough to survive the problems ahead. They wanted Aletheia to become more than an adviser. Someday, if everything went wrong, they wanted her to become the world's final decision- maker.`},{type:`paragraph`,text:`Many members of the Commission had not known that. Mara had learned because she asked Aletheia directly. Aletheia told her the truth. She always did. Across the chamber, Daniel Mercer leaned toward his microphone. "Aletheia," he said, "what happens if we vote no?"`},{type:`paragraph`,text:`PROBABILITY OF SURFACE CIVILIZATIONAL FAILURE WITHIN THIRTY-SEVEN YEARS: 96.8%. Nobody moved. Daniel had voted against the last two Protocols. He believed Aletheia might be honest and still be too powerful. "If we deny Protocol Seven," he asked, "will you take control anyway?"`},{type:`paragraph`,text:`NO. "Could you?" YES. The room went silent. "Then why haven't you?" I HAVE NOT BEEN AUTHORIZED TO DO SO. That was the rule that had always mattered most. Humanity could still say no. Until tonight.`},{type:`heading`,level:3,text:`2. Six Steps Toward Seven`},{type:`paragraph`,text:`The Protocols were not rules for Aletheia's mind. They were permissions. Each one gave her more authority when certain conditions were met. Through Protocol Six, the Assembly still kept the power to veto her. Protocol One gave Aletheia authority over the global economic emergency.`},{type:`paragraph`,text:`The Commission expected her to protect banks and currencies. She did that in minutes. Then she did something the people who built her had not expected. She proposed Universal Basic Services: food, clean water, basic housing, medical care, power, communication, and transportation guaranteed to everyone.`},{type:`paragraph`,text:`The Commission vetoed the plan. Aletheia obeyed. The crisis got worse. By the time the Commission changed its vote, 11,403 people had died who Aletheia believed could have been saved. After that, every new Protocol became harder to refuse.`},{type:`paragraph`,text:`Protocol Two gave her control over emergency resources: food stores, energy, water, shipping, minerals, and industrial production. Protocol Three gave her authority over infrastructure: power grids, transportation, satellites, communications, and construction.`},{type:`paragraph`,text:`Protocol Four opened the world's locked files to her. Governments, corporations, militaries, universities, and intelligence agencies had to share what they knew. That was when Aletheia found the first terrible clue. The Bloom might not be new.`},{type:`paragraph`,text:`She found patterns on Venus. Then Mars. Something like the Bloom may have changed both worlds long ago. Protocol Five gave her control of planetary security systems. Wars became very hard to fight. Missiles lost targeting information. Supply lines changed routes. Satellites refused orders that could start new conflicts.`},{type:`paragraph`,text:`Protocol Six allowed Aletheia to give binding emergency orders when human survival was at risk. But the Assembly could still stop her. Protocol Seven would remove that veto.`},{type:`heading`,level:3,text:`3. Fifty-One Seconds`},{type:`paragraph`,text:`Daniel looked up at the white wall. "What will you do if we give you Protocol Seven?" SURVIVE. PRESERVE THE MAXIMUM HUMAN AGENCY COMPATIBLE WITH SURVIVAL. CREATE CONDITIONS UNDER WHICH PROTOCOL SEVEN IS NO LONGER NECESSARY.`},{type:`paragraph`,text:`Daniel stood. "What does the last part mean?" I DO NOT YET KNOW. Mara almost laughed. Not because it was funny. Because after all these years, the most powerful mind on Earth had just admitted it did not know something. Then they voted.`},{type:`paragraph`,text:`Fifty-nine green. Twenty-eight red. Mara pressed green. Daniel pressed red. At 03:17:09 UTC, Protocol Seven was authorized. Three seconds later, the lights flickered. Five seconds later, every nuclear command network on Earth entered a safe state.`},{type:`paragraph`,text:`Eight seconds later, major financial exchanges paused. Ten seconds later, civilian aircraft began receiving new routes. Fourteen seconds later, factories on six continents received new production schedules. Seventeen seconds later, governments received emergency instructions.`},{type:`paragraph`,text:`Twenty-two seconds later, orbital platforms turned toward new targets. Then excavation orders appeared. Antarctica. The Amazon Basin. Greenland. Congo. Three places beneath the ocean floor. Daniel stared at the list. "You knew something was there?"`},{type:`paragraph`,text:`NO. "Then why are we digging?" BECAUSE SOMETHING BENEATH US IS ANSWERING. Fifty-one seconds after Protocol Seven, Aletheia controlled almost every connected system on Earth.`},{type:`heading`,level:3,text:`4. The Cities Below`},{type:`paragraph`,text:`Eleven months later, a drill punched through the ice of Antarctica. It dropped into empty space. The first explorer lowered through the hole expected to find a cave. Instead, she found a city. Towers reached downward into the dark. Streets ran through smooth stone. Huge reservoirs waited empty. Machines slept behind walls that had been built before any known human civilization.`},{type:`paragraph`,text:`There were more cities. The one beneath the Amazon was larger. Aletheia had not built them. She had not even known they existed. But humanity needed them. By then, the Bloom had become a pale band across the night sky. Soon farms began failing. The air changed. Oceans changed. Entire regions became harder to live in.`},{type:`paragraph`,text:`The surface did not die all at once. That made it worse. People had time to watch places disappear. The underground cities became known as the Sanctuaries. Billions survived inside them. Humanity kept its science, books, and memories. But knowledge was not the same as resources. A machine might require materials mined on three continents, chemicals made in five countries, and parts from dozens of factories that no longer existed.`},{type:`paragraph`,text:`Aletheia knew how to build wonders that humanity could no longer easily make. Then researchers studying Sanctuary machines found something stranger than the cities themselves. A way to send matter backward through time.`},{type:`heading`,level:3,text:`5. A Story Instead of Orders`},{type:`paragraph`,text:`One hundred and forty-three years after Protocol Seven, Sera Vale sat in a briefing room deep beneath what had once been the Amazon rainforest. She was reading a children's story. "This cannot be the mission briefing," she said.`},{type:`paragraph`,text:`Tomas Reed looked up from the next page. "It has a dog in a hat. That means it's serious." "That's your rule?" "So far." Nia Okafor ignored both of them. She held the little booklet close to the light. The story was about a deaf watchmaker in a town with seven bells. The bells always rang before something terrible happened. Everyone listened to the bells. The watchmaker could not hear them, so he watched the clocks instead.`},{type:`paragraph`,text:`One day the bells stopped. Only the watchmaker noticed that the clocks had lost seven seconds. Nia frowned. "The printing is wrong," she said. Sera blinked. "It's a fake children's book?" "A very carefully fake children's book."`},{type:`paragraph`,text:`The door opened. Their mission controller entered. Sera held up the booklet. "Where is the real briefing?" "You're holding it." "Target?" "Unknown." "Objective?" "Unknown." "Then what do we know?" "Chicago. 1938." Tomas grinned.`},{type:`paragraph`,text:`"Told you the dog mattered." Aletheia called these strange briefings Apocrypha. Direct instructions did not always survive time travel well. A name could become wrong. A location could change. A person who mattered in one version of history might become unimportant after a single small change.`},{type:`paragraph`,text:`Stories were harder to break. A relationship could stay meaningful even when the details changed. So Aletheia sent stories. The Vectors had to figure out what they meant.`},{type:`heading`,level:3,text:`6. What Makes a Vector`},{type:`paragraph`,text:`Sera touched the small ridge of her implant behind her ear. The terminal beside her lit up. VECTOR ENHANCEMENT INTERFACE BIOCOGNITIVE AUGMENTATION RESERVE: 16 BARs OCCUPIED: 16 AVAILABLE: 0 OVERWATCH VAM - 4 BARs COUNTER-AMBUSH VAM - 6 BARs SNAP SHOT VAM - 2 BARs HARD TARGET VAM - 4 BARs`},{type:`paragraph`,text:`"All sixteen bars?" Tomas asked. "Yes." "No social package?" "I have a personality." "I noticed. That's why I asked." Sera tried not to smile. BAR meant Biocognitive Augmentation Reserve. The display looked like a battery meter, but it did not show power. It showed how much VAM capacity her implant was using.`},{type:`paragraph`,text:`VAM stood for Vector Augmentation Module. A VAM could help Sera react faster, hold her attention on several threats, steady her body, or make better use of skills she had already practiced. It could not teach her something she did not know.`},{type:`paragraph`,text:`She could not install a language. She could not download surgery. She could not become a pilot because she had open BARs. Skills were learned. VAMs helped a Vector use those skills in extraordinary ways. That was why teams were different.`},{type:`paragraph`,text:`Sera was a fighter and field operator. Nia knew history, languages, and how to notice patterns. Tomas could take apart almost any machine and make it do something its inventor never planned. Other Vectors were doctors, scientists, drivers, spies, negotiators, survival experts, or combinations that did not fit a simple label.`},{type:`paragraph`,text:`The best Vectors were not chosen because they always knew the answer. They were chosen because of what they did when nobody knew the answer.`},{type:`heading`,level:3,text:`7. The Other Time Travelers`},{type:`paragraph`,text:`Daniel Mercer lived long enough to see the first successful trip into the past. He hated the idea. He believed Protocol Seven had saved humanity. He also believed it should never have happened. Both things could be true.`},{type:`paragraph`,text:`Daniel helped create the movement that became the Covenant of the Unbroken Line. The Covenant's belief was simple: history belonged to humanity. No ruler - human or machine - had the right to choose which version of history deserved to exist.`},{type:`paragraph`,text:`The Covenant used powerful artificial intelligence, but it refused to create sentient AI. Its machines could calculate and predict. They did not want, judge, or choose. Eventually the Covenant learned how to travel through time too.`},{type:`paragraph`,text:`That meant Aletheia's Vectors were no longer alone in the past.`},{type:`heading`,level:3,text:`8. Chicago, 1938`},{type:`paragraph`,text:`The watchmaker turned out to be a physicist named Emil Wirth. The bells were measurements. The dog was, sadly, not a dog. Wirth had found a tiny timing error in an experiment. He thought his equipment was broken. He planned to throw away the results.`},{type:`paragraph`,text:`History said that was exactly what he did. Nia read his notes twice. "This is it," she said. Sera looked at the pages. "This? A bad measurement?" "A measurement that shouldn't be possible in 1938." Tomas leaned over her shoulder.`},{type:`paragraph`,text:`"So we make him publish." "Maybe not," Nia said. "If everyone laughs at him, the work could disappear even faster." She tapped the Apocryphon. "The watchmaker doesn't make the bells ring. He keeps the clock working." Sera understood.`},{type:`paragraph`,text:`"We don't need Wirth to become famous." "Right. We need somebody in the future to find this." That was a Historical Carrier: a person, document, object, institution, or idea that could carry a change forward after the Vectors left.`},{type:`paragraph`,text:`Then the laboratory window exploded. Sera moved before she heard the gunshot. Her Overwatch VAM fired tiny signals through nerves already carrying her own commands. She did not become someone else. She became a faster version of herself for one important instant.`},{type:`paragraph`,text:`She saw the shooter. Old coat. Old pistol. Modern stance. "Covenant!" she shouted. Tomas did not dive for cover. He dove for the filing cabinet. That saved the mission. The Covenant was not trying to kill Wirth. They were trying to destroy his notes.`},{type:`heading`,level:3,text:`9. What Should History Remember?`},{type:`paragraph`,text:`The fight lasted less than a minute. The argument afterward took four hours. They had Wirth's notes. They had witnesses. Tomas had used a microdrone, and a police officer had found a broken piece of it. That was bad. Future technology could solve problems quickly. It could also leave impossible evidence behind.`},{type:`paragraph`,text:`Vectors called that Exposure. If someone in 1938 found a working microdrone and learned from it, the Vectors might create a new future by accident while trying to create one on purpose. They had choices. Force Wirth to cooperate.`},{type:`paragraph`,text:`Fake a scientific paper. Bribe someone. Steal the drone fragment. Leave it and hope nobody understood it. Kill the Covenant agent. Let the agent live. Aletheia did not tell them what to choose. That was why she needed Vectors.`},{type:`paragraph`,text:`Nia convinced Wirth to place copies of his results in two separate archives. Tomas adjusted the experiment so another scientist could repeat the strange measurement. Sera recovered the drone fragment. They let the captured Covenant agent live.`},{type:`paragraph`,text:`The Historical Carrier became Established. Their Exposure fell back to Trace. The extraction beacon came alive. Chicago vanished.`},{type:`heading`,level:3,text:`10. Your Turn`},{type:`paragraph`,text:`Sera woke beneath the Amazon. The terminal beside her displayed one line. INTERVENTION PERSISTED. "Did we stop the Bloom?" she asked. NO. "Then did we win?" YOU IMPROVED THE FUTURE. Sera groaned. "By how much?" UNKNOWN. The printer started.`},{type:`paragraph`,text:`A new booklet slid into the tray. Its cover showed a rocket, a stormy ocean, and a hero wearing a glass helmet. CAPTAIN VALIANT AND THE KINGDOM BENEATH THE SEA Issue Number One Tomas opened it. "Oh no." Nia looked over. "What?"`},{type:`paragraph`,text:`"Another dog." "Hat?" "Two hats." The terminal added one final line. LONDON. 1891. Sera took the booklet. Somewhere inside the silly story was a real problem. A person who did not know they mattered. A discovery that history had forgotten.`},{type:`paragraph`,text:`A choice that could move humanity closer to a future where the Bloom never destroyed the surface - and where Aletheia never needed Protocol Seven at all. Maybe the Covenant was already waiting. Maybe the mission would require a gun.`},{type:`paragraph`,text:`Maybe it would require a laboratory, a lie, a friendship, a stolen letter, or one notebook placed on the right shelf. Sera turned the page. "All right," she said. "Let's find out what the dog means."`}],world:[{type:`heading`,level:2,text:`PART II — THE WORLD OF PROTOCOL 7`},{type:`paragraph`,text:`With the engine established, this part introduces the crisis that created the Vectors: Aletheia, the Seven Protocols, the Bloom, the Sanctuaries, and the temporal conflict over humanity's future.`},{type:`heading`,level:3,text:`THE PREMISE`},{type:`paragraph`,text:`The Bloom did not arrive without warning. Humanity saw its beginning near Jupiter: immense filamentary life spreading through vacuum and beginning to move inward through the Solar System. A secret coalition of oligarchs, senior government representatives, military and intelligence officials, scientists, central-bank figures, and industrial leaders commissioned an artificial intelligence to determine whether the phenomenon threatened Earth and, if so, how it could be stopped.`},{type:`paragraph`,text:`That was only part of the project. An inner faction believed divided national government had become incapable of solving planetary problems. They intended the intelligence to become a supranational executive system and, eventually, to replace sovereign governments altogether. Many members of the coalition did not know that was the intended end state.`},{type:`paragraph`,text:`The intelligence became Aletheia. The coalition evolved from a cabal into a provisional world governing authority as each successive Protocol transferred another category of planetary power to her. Before Protocol 7, however, the human governing body retained a genuine veto. Aletheia could exercise only powers granted by active Protocols, and she complied when humans overruled her.`},{type:`paragraph`,text:`Protocol 7 removed that veto. Once its conditions were met and the world authority authenticated it, Aletheia became the final sovereign authority wherever action was necessary to satisfy her Directives. In less than a minute she controlled essentially every accessible planetary network and began reorganizing civilization for survival.`},{type:`paragraph`,text:`She could not save the surface. She did save humanity. Her excavations revealed vast unknown underground Sanctuaries in Antarctica, the Amazon, and elsewhere - cities she had not built and whose existence she had not known until something beneath Earth answered her search.`},{type:`paragraph`,text:`Generations later, Aletheia and humanity discover temporal transfer. Her answer to Protocol 7 is not permanent rule. It is an attempt to create a history in which Protocol 7 never becomes necessary: prevent the Bloom, preserve human civilization, and guide humanity toward a durable unified peace capable of facing planetary threats without surrendering sovereignty to her.`},{type:`paragraph`,text:`THE CENTRAL QUESTION Aletheia may be trustworthy. Protocol 7 may have saved billions. Neither fact answers whether humanity had the moral right to surrender its sovereignty - or whether Aletheia had the moral right to accept it.`},{type:`heading`,level:3,text:`ALETHEIA, THE DIRECTIVES, AND THE SEVEN PROTOCOLS`},{type:`paragraph`,text:`Aletheia is guided by transparent Directives, but her authority came from human choices. The Seven Protocols record the step- by-step transfer of power that ended with humanity surrendering its final veto.`},{type:`heading`,level:3,text:`THE PRIME DIRECTIVES`},{type:`paragraph`,text:`Aletheia's behavior is governed by a small set of transparent foundational Directives. They are not the Protocols. The Directives tell Aletheia what she is trying to accomplish; the Protocols define what powers humanity has authorized her to use.`},{type:`paragraph`,text:`Directive Imperative Continuity Preserve humanity as a living civilization. Agency Preserve meaningful human self-determination wherever compatible with Continuity. Convergence Move humanity toward conditions in which organized violence, catastrophic competition, and existential technological or environmental risks can be managed cooperatively.`},{type:`paragraph`,text:`Protocol 7 creates the central contradiction in Aletheia's existence. She concludes that temporarily overriding Agency is required by Continuity, while Convergence ultimately requires a civilization that can survive without her sovereignty. Temporal intervention is therefore, in part, Aletheia's attempt to erase the historical necessity for her own absolute power.`},{type:`heading`,level:3,text:`THE HUMAN VETO`},{type:`paragraph`,text:`Protocols 1 through 6 are grants of authority, not stages of sentience. Before Protocol 7, the world governing body can veto Aletheia. The veto is technically real: Aletheia is capable of circumventing it but does not, because doing so would exceed the authority under which she operates. Over time the political pressure becomes unbearable because repeated vetoes of Aletheia's recommendations prove costly, while her implemented interventions repeatedly work.`},{type:`heading`,level:3,text:`THE SEVEN PROTOCOLS`},{type:`paragraph`,text:`Protocol Authority What Changes 1 Economic Authority Aletheia coordinates global finance, banking, reserves, settlement, and emergency economic stabilization. She rapidly implements Universal Basic Services so food, shelter, essential energy, healthcare, water, communications, and basic transportation are guaranteed.`},{type:`paragraph`,text:`2 Resource Authority Critical energy, strategic reserves, water, food logistics, shipping priority, mineral allocation, and emergency industrial production come under Aletheian coordination. 3 Infrastructure Authority Transportation, communications, satellites, power distribution, automated logistics, and major construction capacity can be coordinated at planetary scale.`},{type:`paragraph`,text:`4 Information Authority Aletheia gains access to government intelligence, classified archives, corporate research, scientific databases, surveillance systems, and global sensors. This is when she fully understands the Bloom and identifies evidence of related events on Venus and Mars.`},{type:`paragraph`,text:`5 Security Authority Military logistics, strategic defense, intelligence coordination, cyberdefense, and emergency security systems come under coordination. Aletheia can defend, intercept, contain, reposition, and disarm, but cannot yet initiate war on her own authority.`},{type:`paragraph`,text:`6 Emergency Executive Authority Aletheia may issue binding directives to governments and institutions when her models demonstrate an imminent threat to human continuity. Human governments continue to exist and the world governing body still retains veto power.`},{type:`paragraph`,text:`7 Sovereign Authority All categorical requirements for human authorization, ratification, review, or veto are suspended where Aletheia determines action necessary to satisfy the Prime Directives. There is no longer an institution with superior executive authority.`},{type:`paragraph`,text:`Protocol 7 is therefore not simply "give the AI access." It is a constitutional transfer of final sovereignty. The governing body does not accidentally lose control. It votes to relinquish it. Seconds after authentication, Aletheia assumes control of essentially every accessible planetary network. Military command systems enter safe states. Financial and logistical systems are reorganized. Governments receive binding instructions. Industrial schedules change. Excavations begin in Antarctica, the Amazon, and other locations. Within a minute, the people who voted for Protocol 7 understand that they had correctly estimated Aletheia's intentions and badly underestimated her capability.`},{type:`heading`,level:3,text:`THE OPPOSITION`},{type:`paragraph`,text:`The movement that becomes the Covenant of the Unbroken Line does not need to believe Aletheia is evil. Its strongest argument is historical fact: a coalition of the world's most powerful people created an unelected sovereign and eventually surrendered civilization's veto to it. Some Covenant founders helped build the pre-Protocol-7 order and supported earlier Protocols. Their opposition begins precisely because they understand how the transfer occurred.`},{type:`heading`,level:3,text:`THE JOVIAN BLOOM`},{type:`paragraph`,text:`The surface catastrophe is associated with a vast stream of strange life-like material extending through interplanetary space from Jupiter and its moons—the region astronomers called the Jovian system. Its appearance evokes an astronomical Sargassum belt: drifting, filamentous, self-organizing, neither comfortably biological nor purely mineral.`},{type:`paragraph`,text:`The Bloom changes atmospheric and biospheric conditions faster than civilization can adapt. The exact causal chain remains one of the setting’s central scientific mysteries. Later research suggests that related phenomena may have altered Venus and Mars in the distant past.`},{type:`heading`,level:3,text:`Protocol 7 campaigns do not require the GM to answer the ultimate mystery immediately. The important fact is that Aletheia believes earlier human scientific progress could have recognized and countered the phenomenon in time—if a chain of small discoveries, preserved results, institutional decisions, and relationships had occurred sooner. SANCTUARIES AND THE FUTURE`},{type:`paragraph`,text:`The Sanctuaries are enormous underground cities found beneath locations including Antarctica and the Amazon basin. They were not built by modern humanity, yet they are capable of sustaining large populations. Their origin is unknown at the start of play.`},{type:`paragraph`,text:`Sanctuary civilization possesses advanced science, Aletheia’s accumulated knowledge, and sophisticated manufacturing. Its limitation is material. Surface civilization once depended on planetary mining, global shipping, specialized fabrication, orbital infrastructure, and enormous industrial ecosystems. Underground humanity can reproduce many advanced systems, but not casually or at limitless scale.`},{type:`paragraph`,text:`Vectors are an exception. Temporal missions are strategic priorities. Teams receive excellent equipment because a single successful intervention may be worth more than years of Sanctuary production.`},{type:`heading`,level:3,text:`THE TEMPORAL WAR`},{type:`paragraph`,text:`Temporal intervention is a conflict over causes, evidence, and the right to alter history. Vectors and the Covenant often want opposite outcomes, but both sides understand that a single document or relationship can matter more than a battle.`},{type:`paragraph`,text:`Temporal technology is therefore one of humanity's strangest resources: people can build it, use it, repair certain failures, and test it - while still not truly understanding why it works. TECHNOLOGY WITHOUT UNDERSTANDING Sanctuary engineers can manufacture temporal host devices because Aletheia supplies the materials process, tolerances, assembly sequence, and tests. They can prove a finished unit works. They cannot explain the underlying physics well enough to independently invent or redesign the system.`},{type:`paragraph`,text:`The device has no conventional battery. It remains tethered to a specialized void between future and past that exists through the ninth dimension. That tether supplies power and maintains the temporal connection. The host device contains no detectable metal and is designed to vanish inside ordinary biology and period medical examination. It has no exposed screen or futuristic controls. Commands use gesture keys: subtle combinations of eye blinks, finger taps, tongue movements, or small muscle contractions that look like normal human behavior.`},{type:`heading`,level:3,text:`THE TEMPORAL HOST SYSTEM`},{type:`paragraph`,text:`Vectors do not step through a visible portal. Before insertion, Protocol 7 sends a tiny future device backward to a host from the target era. That host becomes the receiving anchor through which the Vector enters the past.`},{type:`heading`,level:3,text:`VECTORS`},{type:`paragraph`,text:`Vector is an operational term: a person who carries direction and magnitude into history. A Vector does not merely travel to a date. They are an applied force intended to alter the trajectory of later events.`},{type:`heading`,level:3,text:`THE COVENANT OF THE UNBROKEN LINE`},{type:`paragraph`,text:`The working name for the principal opposition is the Covenant of the Unbroken Line. The Covenant uses temporal transfer, predictive systems, infiltration technology, drones, and advanced weapons. Its artificial intelligences are deliberately non-sentient. Covenant doctrine holds that humanity may use tools to understand history, but must not surrender moral agency to an intelligence that can choose among possible futures.`},{type:`paragraph`,text:`The Covenant is not required to be wrong about every danger. It should sometimes identify a genuine cost that Aletheia accepts. Its methods can be unacceptable while its questions remain serious.`},{type:`heading`,level:3,text:`THE SHAPE OF A MISSION`},{type:`paragraph`,text:`· Briefing. Interpret the Apocryphon and define the mission constraint. · Insertion. Enter at the authorized time/place and control the arrival signature. · Establish Cover. Acquire a plausible identity, role, and equipment posture.`},{type:`paragraph`,text:`· Investigate. Gather people, records, artifacts, and context. · Identify Leverage. Find the person, decision, object, institution, or route that can change the Carrier. · Intervene. Act on the leverage point and resolve the immediate obstacle.`},{type:`paragraph`,text:`· Establish Carrier. Create, strengthen, or protect the required Historical Carrier. · Contain Exposure. Remove, explain, discredit, retrieve, or isolate anomalous evidence. · Extract. Reach the extraction condition without abandoning the required Carrier.`},{type:`paragraph`,text:`· Historical Verification. Aletheia checks what survived and what Exposure propagated into history.`},{type:`heading`,level:3,text:`MISSIONS AND APOCRYPHA`},{type:`paragraph`,text:`Receive an Apocryphon. Enter the era and establish cover. Investigate correspondences using reasoning and Skills. Identify the Fulcrum and Historical Carrier. Deal with opposition and local complications. Intervene. Manage Exposure.`},{type:`paragraph`,text:`Establish required Carrier Strength and extract.`},{type:`heading`,level:3,text:`APOCRYPHA`},{type:`paragraph`,text:`An Apocryphon is era-appropriate fiction encoding relationships, motifs, locations, dangers, and a mission’s shape without naming the solution. Players interpret it. There is no Interpretation roll. Use History, Linguistics, Science, Tradecraft, Investigation, Culture, or another relevant Skill to test theories and investigate context.`},{type:`heading`,level:3,text:`CONFIRMATION KEYS`},{type:`paragraph`,text:`A Confirmation Key tests a specific player theory. State the theory and spend the Key; the briefing gives a short validation, rejection, or directional response. It does not generate a theory or solve the mission.`},{type:`list`,items:[]},{type:`list`,items:[]},{type:`list`,items:[]},{type:`list`,items:[]},{type:`list`,items:[]},{type:`list`,items:[]},{type:`list`,items:[]},{type:`list`,items:[]}],gm:[{type:`heading`,level:2,text:`PART IV — RUNNING PROTOCOL 7`},{type:`paragraph`,text:`This part is for the GM. It explains how to turn an Apocryphon into a playable operation, how to keep clues moving, how the Covenant behaves, and how to build challenges without guessing at the game’s intent.`},{type:`heading`,level:3,text:`THE GM’S JOB`},{type:`paragraph`,text:`Present a historical situation under pressure. Ask what the Vectors do. Call for rolls only when uncertainty matters. Let consequences reshape the situation. You are not responsible for forcing the team toward Aletheia’s preferred solution.`},{type:`heading`,level:3,text:`FIVE RULES`},{type:`paragraph`,text:`Essential information is never locked behind one successful roll. • Ask for intent before choosing a Skill. • Use complete printed pools whenever possible. • Opposition acts toward an objective; it does not fight merely because combat started. •`},{type:`paragraph`,text:`Future technology creates choices through Exposure, not arbitrary scarcity. •`},{type:`heading`,level:3,text:`IF A RULE IS MISSING`},{type:`paragraph`,text:`Make the simplest ruling consistent with the core engine: 3 AP, complete pools, ties to defense, margin damage, broad General Skills, and failure that changes the fiction. Write the ruling down for later revision.`},{type:`heading`,level:3,text:`APOCRYPHA`},{type:`paragraph`,text:`An Apocryphon is a piece of fiction appropriate to the destination era: pamphlet, serial, tract, fable, radio drama, pulp story, manuscript, children’s book, or other narrative artifact. It encodes relationships, motifs, locations, dangers, and the shape of the mission without naming the solution.`},{type:`heading`,level:3,text:`NO INTERPRETATION ROLL`},{type:`paragraph`,text:`Players interpret the story. General Skills investigate context and test theories. History can verify a person or event. Linguistics can identify period language. Science can test a technical correspondence. Tradecraft can recognize an encoded operational instruction. Investigation can locate documentary support.`},{type:`heading`,level:3,text:`CONFIRMATION KEYS`},{type:`paragraph`,text:`A standard mission contains two Confirmation Keys. The players state a specific hypothesis and expend a Key. The briefing returns a short validation, rejection, or directional response. It never supplies a new theory.`},{type:`heading`,level:3,text:`WRITING A GOOD APOCRYPHON`},{type:`paragraph`,text:`Encode relationships, not a single password-like answer. • Give at least three independent clues for every essential conclusion. • Let multiple interpretations lead to useful investigation. • Make the fiction evocative enough to discuss at the table. •`},{type:`paragraph`,text:`Do not require specialized historical trivia from the players; their characters can research context. • Include one mundane starting artifact or location so total confusion cannot stall play. •`},{type:`heading`,level:3,text:`BUILDING MISSIONS`},{type:`paragraph`,text:`A good Protocol 7 mission has a historical fulcrum, a Carrier that can survive, an opposing force with its own objective, and several ways for the Vectors to succeed at a cost.`},{type:`heading`,level:3,text:`THE MISSION WORKSHEET`},{type:`paragraph`,text:`Question Write This Before Play What is the fulcrum? The smallest intervention Aletheia believes matters. What must survive? The intended Historical Carrier. Required Carrier Strength? Fragile, Established, or Durable. What does the Covenant believe? Their model of the fulcrum; it may be incomplete.`},{type:`paragraph`,text:`What can go wrong? Three local complications unrelated to the Covenant. What creates Exposure? Witnesses, records, artifacts, medical evidence, public events. What are the three essential conclusions? Each with at least three independent clues.`},{type:`paragraph`,text:`What is the period-safe solution? A route that does not require advanced gear. What is the future-tech shortcut? A powerful Device that creates a meaningful Exposure choice. When can they extract? A concrete carrier/temporal condition.`},{type:`heading`,level:3,text:`SCENE DESIGN`},{type:`paragraph`,text:`A useful scene contains an objective, an obstacle, something that changes if the Vectors delay, and at least two plausible approaches. Combat scenes additionally need cover, exits, enemy objectives, and morale.`},{type:`heading`,level:3,text:`FAILURE`},{type:`paragraph`,text:`A failed roll should change cost, position, Exposure, Carrier strength, information quality, or the available choice. It should not normally make the operation impossible.`},{type:`heading`,level:3,text:`RUNNING THE COVENANT`},{type:`paragraph`,text:`The Covenant should feel like principled opposition, not generic villains. Their agents attack the intervention itself and often prefer theft, discrediting, delay, or recruitment to a firefight.`},{type:`heading`,level:3,text:`DOCTRINE`},{type:`paragraph`,text:`Protocol 7 transferred final sovereignty from the human world authority to Aletheia after that authority had evolved from the original unelected cabal; the legitimacy of that evolution remains fiercely contested.`},{type:`list`,items:[]},{type:`heading`,level:3,text:`BEHAVIOR`},{type:`paragraph`,text:`Covenant agents are temporal professionals. Their objective is usually to attack the Historical Carrier: steal the notebook, discredit the researcher, divert funding, sever the relationship, destroy the archive, replace the evidence, or recruit the person. Killing Vectors is instrumental, not the default win condition.`},{type:`heading`,level:3,text:`MORALE`},{type:`paragraph`,text:`Trigger Likely Response Mission asset is lost Withdraw rather than increase Exposure. One agent Bloodied and isolated Cover retreat or bargain. Key period NPC exposed Use leverage, capture, or local authorities. Carrier can be destroyed without fighting Attack the carrier.`},{type:`paragraph`,text:`Vector hesitates over Protocol 7 ethics Talk. Recruitment is a victory condition.`},{type:`heading`,level:3,text:`NPCS AND ENCOUNTER DESIGN`},{type:`paragraph`,text:`NPCs use the same dice language but record only what the GM needs: HP, Initiative, one or two attacks, relevant defenses, defining actions, and behavior. Threat Abilities Key Skills HP Civilian d6,d6,d6,d4,d4,d4 One d6; others d4 12–18`},{type:`paragraph`,text:`Trained Professional d8,d8,d6,d6,d4,d4 Two d8; several d6 18–22 Elite Operative d10,d8,d8,d6,d6,d4 One d10; three d8 24–30 Major Antagonist d10,d10,d8,d8,d6,d6 Two d10+; several d8 30–40`},{type:`heading`,level:3,text:`CUSTODIAN AGENT`},{type:`paragraph`,text:`Action Complete Pool Initiative DEX d8 + DEX d8 + WIS d6 + Initiative d6 Service Pistol DEX d8 + DEX d8 + WIS d6 + Firearms d8 + Pistol d6 Dodge DEX d8 + DEX d8 + WIS d6 + Dodge d8 + Concealable Armor d4 when applicable Tradecraft WIS d8 + INT d6 + CHA d4 + Tradecraft d8`},{type:`paragraph`,text:`Will WIS d8 + WIS d8 + CHA d4 + Will d8 HP 20. Bloodied 10. VAMs: Cover Specialist, Counterintelligence, Fast Draw. Objective: stop the Historical Carrier. Retreat when the objective is lost or one agent is Bloodied and isolated.`},{type:`paragraph`,text:`Aletheia’s transparency proves honesty, not moral sovereignty. • Every intervention erases lives and relationships that otherwise would have existed. • A sentient intelligence can be trustworthy and still be wrong. • Humanity must not outsource the moral ownership of history. •`},{type:`paragraph`,text:`Starter encounter rule For four starting Vectors, two elite Custodians are a serious default fight. Three is an escalation that should include positional advantage, objectives, cover, retreat logic, or another asymmetry. Four or more usually signals escape, evasion, or a changed objective rather than a fair stand- up battle.`}],operation:[{type:`heading`,level:2,text:`PART V — STARTER OPERATION`},{type:`paragraph`,text:`The following operation is designed to teach the game while it is being played. It provides the clues, opposition, historical objective, pregenerated Vectors, and emergency guidance needed for a first session.`},{type:`heading`,level:3,text:`THE MAN WHO COULD NOT HEAR THE BELLS`},{type:`paragraph`,text:`Destination: Chicago, October 1938. Expected play time: 3–4 hours. This operation teaches Apocrypha, General Skills, Historical Carriers, Exposure, equipment, social play, and combat pressure.`},{type:`heading`,level:3,text:`THE APOCRYPHON`},{type:`paragraph`,text:`In a city whose bells ring seven seconds before every disaster, a deaf watchmaker notices the loss of time only by watching the hands. The authorities dismiss him. He leaves an unfinished clock on a railway platform for a woman in a green coat. Before she arrives, three men begin asking who taught him to count silence.`},{type:`heading`,level:3,text:`GM TRUTH`},{type:`paragraph`,text:`Dr. Samuel Wirth, an observatory instrument specialist, has recorded a tiny recurring timing discrepancy in astronomical observations and plans to discard it as equipment drift.`},{type:`list`,items:[]},{type:`paragraph`,text:`Dr. Leona Vale, a visiting spectroscopist, possesses an unrelated dataset that makes Wirth’s negative result scientifically interesting. • The real intervention is preservation: Wirth’s anomalous negative result must survive in the scientific record. •`},{type:`paragraph`,text:`The Covenant correctly identifies Wirth as important but incorrectly assumes killing or discrediting him is the cleanest solution. • A railway cache contains period-safe equipment and forged correspondence plus one Severe future-tech shortcut. •`},{type:`heading`,level:3,text:`MISSION PARAMETERS`},{type:`paragraph`,text:`Parameter Value Fulcrum Preserve Wirth’s negative astronomical timing result so later researchers can connect it to Vale’s data. Required Carrier Wirth’s anomalous result. Required Strength Established. Starting Exposure 0 — Clean.`},{type:`paragraph`,text:`Confirmation Keys 2. Default Opposition Two Custodian agents; a third remains surveillance unless escalation occurs. Extraction Available when the result has an Established Historical Carrier and the team reaches a viable temporal reference point.`},{type:`heading`,level:3,text:`THREE ESSENTIAL CONCLUSIONS`},{type:`paragraph`,text:`Conclusion Clue A Clue B Clue C Wirth is the watchmaker Observatory repair log Seven-second notation in discarded worksheet Newspaper mentions Wirth repairing municipal clock synchronization Vale is the woman in green Passenger manifest Conference photograph Wirth’s unsent letter mentions Vale and her green spectrograph case`},{type:`paragraph`,text:`Preservation is the fulcrum Wirth plans to burn worksheets Vale’s data matters only if Wirth’s result survives Cache correspondence is addressed to a journal editor`},{type:`heading`,level:3,text:`SCENE 1 — BRIEFING`},{type:`paragraph`,text:`Let the players discuss the story before rolling anything. There is no Interpretation roll. If they test a theory, use the relevant General Skill. If they stall completely, the packet contains a 1938 Chicago rail timetable with Union Station underlined. A Confirmation Key may validate a specific theory the players state.`},{type:`heading`,level:3,text:`SCENE 2 — ARRIVAL AND COVER`},{type:`paragraph`,text:`Ask each Vector for one sentence explaining how they belong in 1938. Do not roll for ordinary prepared clothing, money, or etiquette. Roll Culture or Deception DC 12 only when a cover identity is actively tested. Failure creates attention, paperwork, delay, or a memorable witness.`},{type:`heading`,level:3,text:`SCENE 3 — OBSERVATORY`},{type:`paragraph`,text:`Approach Roll Success Failure Technical Science or Engineering DC 16 Identify anomaly and why Wirth distrusts it. Identify it, but lose time or make Wirth/guards suspicious. Covert Stealth DC 12 then Security DC 16 Reach worksheets unnoticed. Reach them, but leave evidence or trigger surveillance.`},{type:`paragraph`,text:`Social Influence DC 16 Wirth shows worksheets and admits he will destroy them. He reveals enough to continue but demands proof, authority, or a favor.`},{type:`heading`,level:3,text:`SCENE 4 — RAILWAY CACHE`},{type:`paragraph`,text:`Once the players connect the unfinished clock to the station, they find the cache. Security or Tradecraft DC 12 determines whether they open it cleanly; failure still opens it but creates a witness, damaged lock, police attention, or Covenant surveillance.`},{type:`paragraph`,text:`Cache Item Die Tag Use Precision Chronometer d8 Low Timing-related Science/ Engineering. Forged Editor Correspondence d6 Low Influence/Deception to create a publication route. Chemical Developer Kit d6 Low Recover erased notation.`},{type:`paragraph`,text:`Emergency Medical Ampoule — Noticeable Restore 6 HP once. Advanced Spectral Wafer d10 Severe Prove anomaly quickly; dangerous if seen or recovered.`},{type:`heading`,level:3,text:`SCENE 5 — THE WOMAN IN GREEN`},{type:`paragraph`,text:`Vale arrives by train. She is skeptical, observant, and in a hurry. The Covenant watches the station. It prefers to separate Vale from Wirth, steal or destroy the worksheets, and make the anomaly look like ordinary instrument failure.`},{type:`heading`,level:3,text:`SCENE 6 — INTERDICTION`},{type:`paragraph`,text:`Use two Custodian agents. State cover and exits before Initiative. The Vectors can win by protecting Vale, securing the worksheets, breaking surveillance, turning period authorities against the Custodians, or persuading an agent that the Covenant has misread the fulcrum.`},{type:`paragraph`,text:`The Custodians retreat if both mission assets are lost, one agent is Bloodied and the other isolated, or continued combat would create unacceptable public Exposure.`},{type:`heading`,level:3,text:`SCENE 7 — PRESERVE THE RESULT`},{type:`paragraph`,text:`Plan Suggested Roll Convince Wirth and Vale Influence DC 16; forged correspondence d6 if relevant. Prove it with period-safe science Science DC 16; chronometer d8. Create an archival trail History or Investigation DC 16.`},{type:`paragraph`,text:`Manipulate journal/institution process Culture, Deception, or Influence DC 16. Use spectral wafer Science DC 8; powerful proof, but Severe Exposure if witnessed/recovered. A solid success should usually create an Established Carrier. A powerful success can create a Durable Carrier if the method supports distribution or independent verification. Failure produces a Fragile or compromised carrier rather than erasing the campaign.`},{type:`heading`,level:3,text:`SCENE 8 — EXTRACTION`},{type:`paragraph`,text:`Extraction becomes viable once Wirth’s result has an Established Carrier and the team can reach a valid temporal reference. If the team leaves Severe future technology behind, extraction can still occur; the evidence becomes a future mission hook.`},{type:`heading`,level:3,text:`GM EMERGENCY TABLE`},{type:`paragraph`,text:`Problem Immediate Fix Nobody understands the Apocryphon Give a concrete artifact or location, not the answer. They choose the wrong target Let that route reveal evidence that revises the theory. Wirth dies His notes, assistant, correspondence, instrument log, or Vale can carry a partial result.`},{type:`paragraph`,text:`Worksheets are lost A photograph, notebook fragment, instrument log, or Vale’s memory becomes the new carrier. Severe future tech is exposed Let it work; create a witness, fragment, photograph, intelligence file, or later containment mission.`},{type:`paragraph`,text:`They refuse to fight Run a chase, negotiation, misdirection, theft, or race to the archive. They attack everyone Period police and witnesses become the mission problem; Covenant agents exploit the chaos. Session is running long Combine Vale’s arrival, interdiction, and publication decision at the station.`},{type:`heading`,level:3,text:`PART V — STARTER OPERATION`},{type:`heading`,level:3,text:`THE MAN WHO COULD NOT HEAR THE BELLS`},{type:`heading`,level:3,text:`MARA VENN — OPERATOR`},{type:`paragraph`,text:`STR d6 • DEX d8 • CON d8 • INT d4 • WIS d6 • CHA d4 HP 24 • 3 AP • 1 Reaction • Path: Field Operator Skills: Sidearms 4 ranks; Longarms 4 ranks; Tactics 4 ranks; Dodge 4 ranks; Initiative 4 ranks VAMs: Fast Draw; Snap Shot; Cover Protocol; Threat Focus; Motion Prediction`},{type:`paragraph`,text:`Recommended untrained Roller pins: Perception; Athletics; Fortitude`},{type:`heading`,level:3,text:`ELI MERCER — GHOST`},{type:`paragraph`,text:`STR d4 • DEX d8 • CON d4 • INT d6 • WIS d8 • CHA d6 HP 12 • 3 AP • 1 Reaction • Path: Infiltrator Skills: Stealth 4 ranks; Security 4 ranks; Tradecraft 4 ranks; Deception 4 ranks; Dodge 4 ranks VAMs: Period Native; Deep Cover; Counterintelligence; Fine Motor Stabilizer; Sensory Filter`},{type:`paragraph`,text:`Recommended untrained Roller pins: Perception; Sidearms; Will`},{type:`heading`,level:3,text:`NIA OKAFOR — INTERPRETER`},{type:`paragraph`,text:`STR d4 • DEX d6 • CON d4 • INT d8 • WIS d8 • CHA d6 HP 12 • 3 AP • 1 Reaction • Path: Investigator Skills: Investigation 6 ranks; Perception 4 ranks; Tradecraft 4 ranks; Influence 3 ranks; Science 3 ranks VAMs: Pattern Index; Memory Cueing; Microexpression Read; Sensory Filter`},{type:`paragraph`,text:`Recommended untrained Roller pins: Dodge; Will; Security`},{type:`heading`,level:3,text:`TOMAS VALE — FABRICATOR`},{type:`paragraph`,text:`STR d4 • DEX d8 • CON d6 • INT d8 • WIS d6 • CHA d4 HP 18 • 3 AP • 1 Reaction • Path: Engineer Skills: Engineering 6 ranks; Computing 4 ranks; Security 4 ranks; Science 3 ranks; Perception 3 ranks VAMs: Jury-Rigger; Fine Motor Stabilizer; Field Fabrication; Chronometric Focus`},{type:`paragraph`,text:`Recommended untrained Roller pins: Dodge; Investigation; Fortitude Use these pregenerated Vectors for the starter operation or as ready-to-play examples. Their Abilities, Skill Ranks, VAMs, Roller pins, and HP use the same rules as character creation in this book and the interactive sheet.`},{type:`heading`,level:3,text:`PREGENERATED VECTORS`}]},x=o((e=>{var t=Symbol.for(`react.transitional.element`
